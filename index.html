<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재고 실사 마감 및 남은 LOT 확인</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 font-sans">

  <!-- 메인 UI: 스캐너 기본 화면 -->
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-xl font-bold mb-4 text-center">📦 실사 스캐너 마감</h1>
    
    <!-- 실사 부서 선택/입력 -->
    <div class="mb-6">
      <label for="scannerDept" class="block text-sm font-medium text-gray-700 mb-1">실사 부서 (창고)</label>
      <select id="scannerDept" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
        <option value="">-- 부서 선택 --</option>
        <option value="생산1팀">생산1팀</option>
        <option value="생산2팀">생산2팀</option>
        <option value="자재창고">자재창고</option>
      </select>
      <p class="text-xs text-gray-500 mt-1">* 선택한 부서와 비슷한 데이터만 모달에 표시됩니다.</p>
    </div>

    <!-- 마감 버튼 -->
    <button id="btnOpenModal" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-md shadow flex justify-center items-center gap-2 transition">
      <span>🏁 마감 - 남은 LOT 확인</span>
    </button>
  </div>


  <!-- 🌟 결과 모달 팝업 (초기에는 hidden 처리) -->
  <div id="remainingOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg max-h-[80vh] flex flex-col">
      
      <!-- 모달 헤더 -->
      <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-lg">
        <h2 class="text-lg font-bold text-gray-700">📋 미스캔(남은) LOT 현황</h2>
        <button id="btnCloseModal" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

      <!-- 요약 카운트 -->
      <div class="p-4 flex justify-between text-center border-b border-gray-100 bg-blue-50 text-sm">
        <div class="flex-1">
          <p class="text-gray-500 mb-1">필터링 부서</p>
          <p id="displayDept" class="font-bold text-blue-700">-</p>
        </div>
        <div class="flex-1 border-l border-gray-300">
          <p class="text-gray-500 mb-1">남은 건수</p>
          <p class="font-bold text-red-500 text-lg"><span id="remainingCount">0</span>건</p>
        </div>
      </div>

      <!-- 남은 LOT 리스트 테이블 -->
      <div class="overflow-y-auto flex-1 p-4">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
              <th class="p-2 border-b">LOT 번호</th>
              <th class="p-2 border-b">품번/품명</th>
              <th class="p-2 border-b">부서(창고)</th>
              <th class="p-2 border-b text-right">수량</th>
            </tr>
          </thead>
          <tbody id="remainingList">
            <!-- 자바스크립트로 리스트가 동적 생성되는 영역 -->
          </tbody>
        </table>
      </div>

      <!-- 모달 푸터 (닫기 버튼) -->
      <div class="p-4 border-t border-gray-200">
        <button id="btnConfirmClose" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded transition">
          확인 (닫기)
        </button>
      </div>
    </div>
  </div>


  <!-- ⚙️ JavaScript 로직 -->
  <script>
    // 1. 가상의 DB 데이터 (실제로는 Firestore apiRemaining 등에서 가져온 배열)
    const mockDbData = [
      { lot: "L-2309-001", partNo: "P001", partName: "볼트", dept: "생산1팀", qty: 500 },
      { lot: "L-2309-002", partNo: "P002", partName: "너트", dept: "생산1팀(조립)", qty: 300 }, // 비슷한 이름 테스트
      { lot: "L-2309-003", partNo: "P003", partName: "와셔", dept: "생산2팀", qty: 1000 },
      { lot: "L-2309-004", partNo: "P004", partName: "베어링", dept: "자재창고", qty: 250 },
      { lot: "L-2309-005", partNo: "P005", partName: "모터", dept: "자재창고-A구역", qty: 10 }, // 비슷한 이름 테스트
    ];

    // DOM 요소 가져오기
    const btnOpenModal = document.getElementById('btnOpenModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnConfirmClose = document.getElementById('btnConfirmClose');
    const remainingOverlay = document.getElementById('remainingOverlay');
    
    // 모달 열기 이벤트 (마감 버튼 클릭 시)
    btnOpenModal.addEventListener('click', () => {
      // 실제 환경에서는 여기서 API를 호출하여 DB에서 미스캔 LOT을 가져와야 합니다.
      const remainingLots = mockDbData; // 임시로 가상 데이터 할당
      
      renderRemainingModal(remainingLots);
      remainingOverlay.classList.remove('hidden'); // 모달 표시
      
      // 로그 저장 API 호출 부분 (apiLogClose)
      console.log("마감 로그 DB 저장 실행... (API 연동 필요)");
    });

    // 모달 닫기 이벤트
    const closeModal = () => remainingOverlay.classList.add('hidden');
    btnCloseModal.addEventListener('click', closeModal);
    btnConfirmClose.addEventListener('click', closeModal);

    // 🌟 핵심 로직: 부서명 필터링 및 렌더링 함수
    function renderRemainingModal(allRemainingLots) {
      // 현재 스캐너에 입력/선택된 실사 부서 가져오기
      const currentDept = (document.getElementById('scannerDept').value || '').trim();
      document.getElementById('displayDept').innerText = currentDept || '전체';

      // 선택된 부서와 일치하거나 "비슷한(포함하는)" LOT만 필터링
      const filteredLots = allRemainingLots.filter(item => {
        if (!currentDept) return true; // 부서 선택이 안 되어있으면 전체 표시

        const itemDept = (item.dept || '').toString().trim();

        // includes를 사용하여 "생산1팀"을 선택했을 때 "생산1팀(조립)"도 함께 나오도록 처리
        return itemDept.toLowerCase().includes(currentDept.toLowerCase()) ||
               currentDept.toLowerCase().includes(itemDept.toLowerCase());
      });

      // 결과 카운트 업데이트
      document.getElementById('remainingCount').innerText = filteredLots.length;

      // 리스트 HTML 생성
      const listContainer = document.getElementById('remainingList');
      if (filteredLots.length === 0) {
        // 남은 항목이 없을 때
        listContainer.innerHTML = `
          <tr>
            <td colspan="4" class="text-center p-8 text-gray-500">
              <span class="text-2xl block mb-2">🎉</span>
              해당 부서[${currentDept || '전체'}]의<br>남은 LOT이 없습니다!
            </td>
          </tr>
        `;
      } else {
        // 남은 항목이 있을 때 테이블 렌더링
        listContainer.innerHTML = filteredLots.map(item => `
          <tr class="border-b hover:bg-gray-50 transition">
            <td class="p-2 font-mono font-bold text-blue-600 align-middle">${item.lot}</td>
            <td class="p-2 align-middle">
              <div class="text-xs text-gray-500">${item.partNo}</div>
              <div class="font-medium">${item.partName}</div>
            </td>
            <td class="p-2 text-gray-600 text-sm align-middle">${item.dept}</td>
            <td class="p-2 text-right font-bold align-middle">${item.qty.toLocaleString()}</td>
          </tr>
        `).join('');
      }
    }
  </script>
</body>
</html>
