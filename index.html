<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb = createClient("https://siwaynipvwtwuoobyarp.supabase.co", "sb_publishable_lEKhT8TYzo368Hxfd0E8-Q_D9JEyO9Z");

const wrap = r => ({ id: r.id, data: () => r });

async function fetchAll(build){
    const out = [];
    for (let from = 0; ; from += 1000){
        const { data, error } = await build().order('id').range(from, from + 999);
        if (error) throw error;
        data.forEach(r => out.push(wrap(r)));
        if (data.length < 1000) break;
    }
    return out;
}

const STOCK_COL = "stock";
const LOG_COL = "scan_log";

// 오프라인 큐 로직
const QUEUE_KEY = 'lot_scan_queue';
function readQueue(){ try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch(e){ return []; } }
function writeQueue(q){ try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch(e){} }
async function flushQueue(){
    const q = readQueue();
    if (!q.length) return;
    const { error } = await sb.from(LOG_COL).insert(q);
    if (!error) writeQueue([]);
}
async function insertScanLog(row){
    const { error } = await sb.from(LOG_COL).insert(row);
    if (error){ console.error(error); writeQueue([...readQueue(), row]); }
    else flushQueue();
}
window.addEventListener('online', flushQueue);
flushQueue();

window.cachedStockMap = new Map();

// 재고 캐시 영속 저장 (새로고침해도 유지, 마감 시 삭제)
const CACHE_KEY = 'lot_stock_cache_v1';
// 오늘 스캔된 LOT 집합 (진행바/마감 공용) - 서버 기록 + 미전송 오프라인 큐
window.scannedTodaySet = new Set();
window.syncScannedToday = async function(){
    const { date: today } = nowParts();
    const logs = await fetchAll(() => sb.from(LOG_COL).select('lot_no').eq('scan_date', today));
    const set = new Set();
    logs.forEach(d => set.add(d.data().lot_no));
    readQueue().forEach(q => { if (q.scan_date === today) set.add(q.lot_no); });
    window.scannedTodaySet = set;
    return set;
};

window.saveStockCache = function(){
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            saved_at: new Date().toISOString(),
            rows: Array.from(window.cachedStockMap.values())
        }));
    } catch(e) { console.error('캐시 저장 실패(메모리 캐시만 사용)', e); }
};
const START_KEY = 'lot_stock_started_at';   // [시작] 누른 시각 (12시간 뒤 자동 마감 기준)
window.clearStockCache = function(){
    window.cachedStockMap.clear();
    try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem(START_KEY); } catch(e){}
};
(function restoreStockCache(){
    try {
        const o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (o && Array.isArray(o.rows)) o.rows.forEach(r => { if (r && r.lot_no) window.cachedStockMap.set(r.lot_no, r); });
    } catch(e) { console.error(e); }
})();

function cleanDate8Digits(str) {
    if (!str) return '';
    const digits = String(str).replace(/[^0-9]/g, '');
    return digits.substring(0, 8);
}

window.download10DaysStock = async function(){
    const status = document.getElementById("status");
    status.innerHTML = "⏳ 최근 10일치 재고 데이터 다운로드 중...";
    try {
        const snap = [];
        for (let from = 0; from < 2000; from += 1000){
            const { data, error } = await sb.from(STOCK_COL).select('*')
                .order('upload_date', { ascending:false }).order('run_at', { ascending:false }).order('id', { ascending:false })
                .range(from, from + 999);
            if (error) throw error;
            data.forEach(r => snap.push(wrap(r)));
            if (data.length < 1000) break;
        }
        window.cachedStockMap.clear();
        let count = 0;
        snap.forEach(d => {
            const data = d.data();
            if (data.lot_no) {
                if (!window.cachedStockMap.has(data.lot_no)) {
                    window.cachedStockMap.set(data.lot_no, data);
                    count++;
                }
            }
        });
        window.saveStockCache();
        try { localStorage.setItem(START_KEY, String(Date.now())); } catch(e){}
        status.innerHTML = `✅ 재고 데이터 ${count}건 다운로드 완료!`;
        return { success: true, count };
    } catch(e) {
        console.error(e);
        status.innerHTML = "❌ 재고 다운로드 실패. 네트워크를 확인하세요.";
        return { success: false };
    }
};

// 서버의 최신 재고 업로드 버전(upload_date, run_at)이 내려받은 캐시와 다른지 확인 (true = 달라짐)
window.checkStockUpdated = async function(){
    if (!window.cachedStockMap || window.cachedStockMap.size === 0 || !navigator.onLine) return false;
    try {
        const { data, error } = await sb.from(STOCK_COL).select('upload_date, run_at')
            .order('upload_date', { ascending:false }).order('run_at', { ascending:false }).limit(1);
        if (error || !data || !data.length) return false;   // 조회 실패/빈 테이블이면 건드리지 않음
        const srv = data[0];
        let loc = null;
        window.cachedStockMap.forEach(r => {
            const a = String(r.upload_date || ''), b = String(r.run_at || '');
            if (!loc || a > loc.a || (a === loc.a && b > loc.b)) loc = { a, b };
        });
        if (!loc) return false;
        return String(srv.upload_date || '') !== loc.a || String(srv.run_at || '') !== loc.b;
    } catch(e) { console.error(e); return false; }
};

function nowParts(){
    const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    });
    const map = {};
    fmt.formatToParts(new Date()).forEach(p => map[p.type] = p.value);
    const date = `${map.year}-${map.month}-${map.day}`;
    const time = `${map.hour}:${map.minute}:${map.second}`;
    return { date, datetime: `${date} ${time}` };
}

window.apiLookup = async function(lot){
    lot = (lot || '').trim();
    if (!lot) return { found:false, error:'LOT 번호가 없습니다.' };

    const scanner = document.getElementById("scannerInput").value.trim();
    const scanDept = document.getElementById("deptSelect").value;

    let stockRow = window.cachedStockMap.get(lot);
    if (!stockRow) {
        const { data: foundRows, error: findErr } = await sb.from(STOCK_COL).select('*').eq('lot_no', lot)
            .order('upload_date', { ascending:false }).order('run_at', { ascending:false }).limit(1);
        if (findErr) throw findErr;
        let rows = foundRows;
        if (rows.length > 0) {
            rows.sort((a,b) => (a.upload_date < b.upload_date ? 1 : -1));
            stockRow = rows[0];
        }
    }

    const { date: today, datetime: now } = nowParts();
    await insertScanLog({
        lot_no: lot, scan_date: today, scanned_at: now,
        scanned_by: scanner, scan_dept: scanDept,
        actual_qty: null, diff: null
    });
    window.scannedTodaySet.add(lot);   // 진행바 즉시 반영

    if (!stockRow) {
        return { found: false, lot_no: lot };
    }

    const todayNum = cleanDate8Digits(today);
    const uploadNum = cleanDate8Digits(stockRow.upload_date);
    const isRecent1Day = (uploadNum !== '' && uploadNum === todayNum);

    return {
        found: true,
        isRecent1Day: isRecent1Day,
        lot_no: lot,
        item_no: stockRow.item_no || '-',
        item_name: stockRow.item_name || '-',
        qty: isRecent1Day ? Number(stockRow.qty || 0) : 0,
        unit: stockRow.unit || '',
        upload_date: stockRow.upload_date || '-'
    };
};

// 마감: 캐시(가장 최근 업로드분) 중 선택 부서의 LOT 가운데 오늘 아직 스캔 안 된 것
window.apiRemaining = async function(dept){
    const rows = Array.from(window.cachedStockMap.values());
    let master = '';
    rows.forEach(r => { const d = cleanDate8Digits(r.upload_date); if (d > master) master = d; });
    const masterRows = rows.filter(r => cleanDate8Digits(r.upload_date) === master);
    const deptRows = masterRows.filter(r => (r.department || '') === dept);

    const scanned = await window.syncScannedToday();   // 미전송 오프라인 스캔 포함

    const items = deptRows.filter(r => !scanned.has(r.lot_no))
        .sort((a,b) => String(a.item_no||'').localeCompare(String(b.item_no||'')) || String(a.lot_no).localeCompare(String(b.lot_no)));

    const deptValues = Array.from(new Set(masterRows.map(r => r.department || '(없음)'))).sort();
    return {
        master_date: master, dept, total: deptRows.length,
        checked: deptRows.length - items.length, remaining: items.length,
        items, deptValues
    };
};

window.apiSaveQty = async function(lot, actualQtyRaw, systemQty){
    const actualQty = Math.round(Number(actualQtyRaw));
    const diff = actualQty - systemQty;
    const { date: today, datetime: now } = nowParts();

    const logSnap = await fetchAll(() => sb.from(LOG_COL).select('*').eq('lot_no', lot).eq('scan_date', today));
    let logRows = [];
    logSnap.forEach(d => logRows.push({ id: d.id, ...d.data() }));
    logRows.sort((a,b) => (a.scanned_at > b.scanned_at ? -1 : 1));
    const target = logRows[0];

    if (target){
        const { error: updErr } = await sb.from(LOG_COL).update({ actual_qty: actualQty, diff: diff }).eq('id', target.id);
        if (updErr) throw updErr;
    } else {
        await insertScanLog({
            lot_no: lot, scan_date: today, scanned_at: now, actual_qty: actualQty, diff: diff
        });
    }

    return { success: true, actual_qty: actualQty, diff };
};

// 시작/마감 이벤트 기록 (close_log 테이블). 전송 실패 시 큐에 보관했다가 재전송
const EVENT_LOG_COL = "close_log";
const EVENT_QUEUE_KEY = 'lot_event_queue';
function readEvtQ(){ try { return JSON.parse(localStorage.getItem(EVENT_QUEUE_KEY) || '[]'); } catch(e){ return []; } }
function writeEvtQ(q){ try { localStorage.setItem(EVENT_QUEUE_KEY, JSON.stringify(q)); } catch(e){} }
async function flushEventQueue(){
    const q = readEvtQ();
    if (!q.length) return;
    const { error } = await sb.from(EVENT_LOG_COL).insert(q);
    if (!error) writeEvtQ([]);
}
window.apiLogEvent = async function(event, data){
    const { date, datetime } = nowParts();
    const row = {
        event: event, scanner: data.scanner || '', dept: data.dept || '',
        scan_date: date, closed_at: datetime,
        total: (data.total === undefined ? null : data.total), checked: (data.checked === undefined ? null : data.checked), remaining: (data.remaining === undefined ? null : data.remaining)
    };
    try {
        const { error } = await sb.from(EVENT_LOG_COL).insert(row);
        if (error) throw error;
        flushEventQueue();
        return true;
    } catch(e) {
        console.error('시작/마감 기록 저장 실패 - 큐에 보관', e);
        writeEvtQ([...readEvtQ(), row]);
        return false;
    }
};
window.addEventListener('online', flushEventQueue);
flushEventQueue();

if (window.refreshStartBtn) window.refreshStartBtn();
</script>

    const target = rows.filter(r =>
        String(r.upload_date || "").replace(/[^0-9]/g, "").substring(0, 8) === master && (!dept || r.department === dept));
    const set = window.scannedTodaySet || new Set();
    const checked = target.filter(r => set.has(r.lot_no)).length;

// 마감하지 않았는데 서버 최신 데이터가 내려받은 것과 달라지면 자동으로 [시작] 상태로 되돌림
let staleChecking = false;
window.autoResetIfStale = async function(){
    if (staleChecking || !window.checkStockUpdated) return;
    if (!window.cachedStockMap || window.cachedStockMap.size === 0) return;
    staleChecking = true;
    try {
        const stale = await window.checkStockUpdated();
        if (!stale) return;
        // 수량 입력/마감 창이 열려 있거나 인식 중이면 방해하지 않고 다음 확인 때 처리
        if (qtyModalOverlay.style.display === "flex" || closeModalOverlay.style.display === "flex" || capturing) return;
        window.clearStockCache();
        lotInfoBox.style.display = "none"; lotInfoBox.className = "";
        resultInput.value = "";
        window.refreshStartBtn();
        status.innerHTML = "🔄 서버에 새 재고 데이터가 올라왔습니다. [시작] 버튼으로 다시 받아주세요.";
        if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
    } finally { staleChecking = false; }
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) window.autoResetIfStale(); });
window.addEventListener("online", () => window.autoResetIfStale());
window.addEventListener("load", () => setTimeout(() => window.autoResetIfStale(), 1500));

// 다른 사람의 스캔도 반영되도록 2분마다 서버와 동기화
// 2분마다 자동 확인은 제거 - 앱을 열거나 다시 돌아왔을 때만 서버와 동기화 (전송량 절약)
document.addEventListener("visibilitychange", () => { if (!document.hidden) window.syncProgress(); });

// [시작] 후 12시간이 지나면 자동 마감 (서버 조회 없이 저장된 시각만 비교 → 전송량 소모 없음)
const AUTO_CLOSE_MS = 12 * 60 * 60 * 1000;
let autoCloseTimer = null;
window.autoCloseIfExpired = function(){
    if (autoCloseTimer){ clearTimeout(autoCloseTimer); autoCloseTimer = null; }
    if (!window.cachedStockMap || window.cachedStockMap.size === 0) return;
    let t = 0;
    try { t = Number(localStorage.getItem('lot_stock_started_at') || 0); } catch(e){}
    if (!t){ t = Date.now(); try { localStorage.setItem('lot_stock_started_at', String(t)); } catch(e){} }   // 이전 버전 캐시는 지금부터 12시간
    const left = t + AUTO_CLOSE_MS - Date.now();
    if (left > 0){ autoCloseTimer = setTimeout(window.autoCloseIfExpired, Math.min(left, 3600000)); return; }
    // 수량 입력/마감 창이 열려 있거나 인식 중이면 1분 뒤 다시 시도
    if (qtyModalOverlay.style.display === "flex" || closeModalOverlay.style.display === "flex" || capturing){
        autoCloseTimer = setTimeout(window.autoCloseIfExpired, 60000); return;
    }
    window.apiLogEvent('close', { scanner: (scannerInput.value.trim() || '') + ' (자동마감)', dept: deptSelect.value });
    window.clearStockCache();
    lotInfoBox.style.display = "none"; lotInfoBox.className = "";
    resultInput.value = "";
    window.refreshStartBtn();
    status.innerHTML = "⏰ [시작] 후 12시간이 지나 자동 마감되었습니다. 다시 실사하려면 [시작] 버튼을 눌러주세요.";
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) window.autoCloseIfExpired(); });
window.addEventListener("load", () => setTimeout(() => window.autoCloseIfExpired(), 1500));

const closeModalOverlay = document.getElementById("closeModalOverlay");
const closeSummary = document.getElementById("closeSummary");
const closeList = document.getElementById("closeList");
const closeConfirmBtn = document.getElementById("closeConfirmBtn");
const closeCancelBtn = document.getElementById("closeCancelBtn");
let closeLoadFailed = false;
let closeRemainingCount = 0;
let closeInfo = null;      // 마감 모달을 연 시점의 집계 (기록용)
let closeWho = { scanner: "", dept: "" };

function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function openCloseModal(){
    if (!deptSelect.value) { alert("실사 부서를 선택해주세요."); deptSelect.focus(); return; }
    const dept = deptSelect.value;
    closeWho = { scanner: scannerInput.value.trim(), dept: dept };

    closeModalOverlay.style.display = "flex";

    closeConfirmBtn.disabled = true;

    try {
        const r = await window.apiRemaining(dept);
        window.updateProgressBar();
        closeInfo = { total: r.total, checked: r.checked, remaining: r.remaining };
        closeRemainingCount = r.remaining;
        closeSummary.innerHTML =
            `기준: ${esc(r.master_date)} 업로드분 · <b>${esc(dept)}</b><br>` +
            `확인 완료 <b class="ok">${r.checked}</b> / ${r.total}건 · 남음 <b class="ng">${r.remaining}</b>건`;
        if (r.total === 0) {
            closeList.innerHTML = `<div class="close-item"><div class="sub" style="color:#ffb84d;">이 부서로 분류된 LOT이 없습니다.<br>재고 데이터의 부서값: ${esc(r.deptValues.join(", "))}</div></div>`;
        } else if (r.remaining === 0) {
            closeList.innerHTML = `<div class="close-item" style="color:#00e676;font-weight:bold;text-align:center;">🎉 남은 LOT이 없습니다!</div>`;
        } else {
            closeList.innerHTML = r.items.map(it =>
                `<div class="close-item"><div class="lot">${esc(it.lot_no)}</div>` +
                `<div class="sub">${esc(it.item_no)} · ${esc(it.item_name)} · ${esc(it.warehouse || "-")} · ${esc(it.qty)}${esc(it.unit || "")}</div></div>`
            ).join("");
        }
    } catch(e) {
        console.error(e);
        closeLoadFailed = true;
        closeSummary.innerHTML = `<span style="color:#ff8a8a;">❌ 남은 LOT 조회 실패 - 네트워크를 확인하세요.</span>`;
    }
    closeConfirmBtn.disabled = false;

closeCancelBtn.onclick = () => { closeModalOverlay.style.display = "none"; };

closeConfirmBtn.onclick = () => {

    else if (closeRemainingCount > 0) msg = `남은 LOT이 ${closeRemainingCount}건 있습니다.\n그래도 마감하고 저장된 재고 캐시를 삭제할까요?`;
    else msg = "마감하고 저장된 재고 캐시를 삭제할까요?";

    // 마감 기록 (누가/언제/부서/확인 현황) - 캐시 삭제 전에 남김

resultInput.addEventListener("input", function() {

        resultInput.value = nums.slice(0, 10) + '-' + nums.slice(10);

        resultInput.value = nums;
    }

let zoomCaps = null;

function updateZoomLabel(){ zoomLabel.innerText = currentZoom.toFixed(1) + "x"; }

function setupZoom(track){
    var caps = (track.getCapabilities && track.getCapabilities()) || {};
    if (caps.zoom){
        zoomCaps = caps.zoom;
        currentZoom = (track.getSettings && track.getSettings().zoom) || zoomCaps.min || 1;
    } else {
        zoomCaps = null;
        currentZoom = 1;
    }
    updateZoomLabel();
}

function setupTorch(track){
    var caps = (track.getCapabilities && track.getCapabilities()) || {};
    torchBtn.style.display = caps.torch ? "block" : "none";
}

function setupFocus(track){
    try {
        var caps = (track.getCapabilities && track.getCapabilities()) || {};
        if (caps.focusMode && caps.focusMode.indexOf("continuous") >= 0){
            var p = track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
            if (p && p.catch) p.catch(function(){});
        }
    } catch(e) {}
}

async function initCamera(){
    var camStatus = document.getElementById("camStatus");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        camStatus.innerText = "⚠️ 카메라 미지원 (Chrome 최신 버전 사용)";
        return;
    }
    // 폰이 지원하지 않는 해상도 요청이면 단계적으로 낮춰서 재시도 (구형 폰 대응)
    var attempts = [
        { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: { facingMode: "environment" }, audio: false },
        { video: true, audio: false }
    ];
    var stream = null;
    for (var i = 0; i < attempts.length && !stream; i++){
        try { stream = await navigator.mediaDevices.getUserMedia(attempts[i]); } catch(e) { console.error(e); }
    }
    if (!stream){ camStatus.innerText = "⚠️ 카메라 사용 불가 (권한 확인)"; return; }
    video.srcObject = stream;
    try { await video.play(); } catch(e) {}
    videoTrack = stream.getVideoTracks()[0];
    camStatus.style.display = "none";
    setupZoom(videoTrack); setupTorch(videoTrack); setupFocus(videoTrack);
    // 숫자 인식 엔진은 미리 준비해 두면 첫 촬영이 빨라짐
    setTimeout(function(){ getOcrWorker().catch(function(){}); }, 2500);
}
initCamera();

function setZoom(val){
    if (zoomCaps){
        var maxZ = Math.min(zoomCaps.max || 1, 10);
        currentZoom = Math.max(zoomCaps.min || 1, Math.min(maxZ, val));
        try {
            var p = videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] });
            if (p && p.catch) p.catch(function(){});
        } catch(e) {}
    } else {
        // 하드웨어 줌 미지원 폰: 화면 확대(디지털 줌) - 인식할 때도 같은 비율로 잘라냄
        currentZoom = Math.max(1, Math.min(3, val));
        video.style.transform = currentZoom > 1 ? "scale(" + currentZoom + ")" : "none";
    }
    updateZoomLabel();
}

zoomInBtn.onclick = () => setZoom(currentZoom + 0.5);
zoomOutBtn.onclick = () => setZoom(currentZoom - 0.5);

let initialPinchDist = null;
let initialZoomOnPinch = 1;

camWrap.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialZoomOnPinch = currentZoom;
    }
}, { passive: true });

camWrap.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && initialPinchDist) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        setZoom(initialZoomOnPinch * (dist / initialPinchDist));
    }
}, { passive: true });

camWrap.addEventListener("touchend", (e) => {
    if (e.touches.length < 2) initialPinchDist = null;
});

torchBtn.onclick = async () => {
    if (!videoTrack) return;
    torchOn = !torchOn;
    try {
        await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
        torchBtn.classList.toggle("on", torchOn);
    } catch(e) { alert("이 기기에서는 플래시를 지원하지 않습니다."); }
};

const guideBox = document.getElementById("guideBox");

// ==PURE-START== (화면과 무관한 순수 함수: 테스트 대상)
function lotPlausible(lot){
    var mm = parseInt(lot.substr(2, 2), 10), dd = parseInt(lot.substr(4, 2), 10);
    return mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31;   // LOT 앞 6자리는 yymmdd
}

// 텍스트에서 LOT 후보(10자리-3자리) 전부 추출 (줄 단위 + 전체 이어붙인 것)
function extractLots(text){
    var out = [];
    if (!text) return out;
    var raw = String(text);
    var chunks = raw.split(/\r?\n/).concat([raw]);
    for (var i = 0; i < chunks.length; i++){
        var t = chunks[i].replace(/\s+/g, "");
        var re = /(\d{10})-?(\d{3})/g, m;
        while ((m = re.exec(t)) !== null){
            var lot = m[1] + "-" + m[2];
            if (out.indexOf(lot) < 0) out.push(lot);
            re.lastIndex = m.index + 1;
        }
    }
    return out;
}

function getGray(canvas){
    var w = canvas.width, h = canvas.height;
    var d = canvas.getContext("2d").getImageData(0, 0, w, h).data;
    var g = new Uint8ClampedArray(w * h);
    for (var i = 0, j = 0; i < d.length; i += 4, j++){
        g[j] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
    }
    return { g: g, w: w, h: h };
}

// 명암 늘리기: 색 바랜 종이/어두운 조명에서 글자와 배경 차이를 키움
function stretchGray(g){
    var hist = new Array(256).fill(0), n = g.length, i;
    for (i = 0; i < n; i++) hist[g[i]]++;
    var lo = 0, hi = 255, acc = 0;
    for (i = 0; i < 256; i++){ acc += hist[i]; if (acc >= n * 0.02){ lo = i; break; } }
    acc = 0;
    for (i = 255; i >= 0; i--){ acc += hist[i]; if (acc >= n * 0.02){ hi = i; break; } }
    if (hi - lo < 30) hi = Math.min(255, lo + 30);
    var out = new Uint8ClampedArray(n), scale = 255 / (hi - lo);
    for (i = 0; i < n; i++) out[i] = (g[i] - lo) * scale;
    return out;
}

// 주변 밝기 기준 이진화: 그늘/구겨진 자국/얼룩이 있어도 글자만 남김
function adaptiveBinarize(g, w, h){
    var W = w + 1, integral = new Float64Array(W * (h + 1)), x, y;
    for (y = 0; y < h; y++){
        var rowSum = 0;
        for (x = 0; x < w; x++){
            rowSum += g[y * w + x];
            integral[(y + 1) * W + (x + 1)] = integral[y * W + (x + 1)] + rowSum;
        }
    }
    var r = Math.max(8, Math.round(h / 8)), out = new Uint8ClampedArray(w * h);
    for (y = 0; y < h; y++){
        var y0 = Math.max(0, y - r), y1 = Math.min(h - 1, y + r);
        for (x = 0; x < w; x++){
            var x0 = Math.max(0, x - r), x1 = Math.min(w - 1, x + r);
            var sum = integral[(y1 + 1) * W + (x1 + 1)] - integral[y0 * W + (x1 + 1)]
                    - integral[(y1 + 1) * W + x0] + integral[y0 * W + x0];
            var mean = sum / ((x1 - x0 + 1) * (y1 - y0 + 1));
            out[y * w + x] = g[y * w + x] < mean * 0.88 ? 0 : 255;
        }
    }
    return out;
}
// ==PURE-END==

function grayToCanvas(g, w, h){
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var ctx = c.getContext("2d"), id = ctx.createImageData(w, h);
    for (var i = 0, j = 0; j < g.length; i += 4, j++){
        id.data[i] = id.data[i + 1] = id.data[i + 2] = g[j]; id.data[i + 3] = 255;
    }
    ctx.putImageData(id, 0, 0);
    return c;
}

function lotInCache(lot){ return !!(window.cachedStockMap && window.cachedStockMap.has(lot)); }
function nextTick(){ return new Promise(function(r){ setTimeout(r, 0); }); }
function withTimeout(p, ms){
    return new Promise(function(resolve, reject){
        var t = setTimeout(function(){ reject(new Error("timeout")); }, ms);
        p.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
    });
}

// 초록 박스 위치를 카메라 원본 픽셀 좌표로 변환 (object-fit: cover + 디지털 줌 보정)
function guideBoxToVideoCoords(){
    var wrapRect = camWrap.getBoundingClientRect(), boxRect = guideBox.getBoundingClientRect();
    var vw = video.videoWidth, vh = video.videoHeight;
    var scale = Math.max(wrapRect.width / vw, wrapRect.height / vh);
    var relLeft = boxRect.left - wrapRect.left, relTop = boxRect.top - wrapRect.top;
    var relW = boxRect.width, relH = boxRect.height;
    if (!zoomCaps && currentZoom > 1){
        var cx = wrapRect.width / 2, cy = wrapRect.height / 2;
        relLeft = cx + (relLeft - cx) / currentZoom; relTop = cy + (relTop - cy) / currentZoom;
        relW = relW / currentZoom; relH = relH / currentZoom;
    }
    return {
        srcX: (relLeft + (vw * scale - wrapRect.width) / 2) / scale,
        srcY: (relTop + (vh * scale - wrapRect.height) / 2) / scale,
        srcW: relW / scale, srcH: relH / scale
    };
}

// 초록 박스 영역만 잘라냄 (손 떨림 대비 여유 조금). 구형 폰 메모리를 위해 크기 제한
function makeCrop(){
    if (!video.videoWidth) return null;
    var c = guideBoxToVideoCoords();
    var padX = c.srcW * 0.06, padY = c.srcH * 0.10;
    var sx = Math.max(0, c.srcX - padX), sy = Math.max(0, c.srcY - padY);
    var sw = Math.min(video.videoWidth - sx, c.srcW + padX * 2), sh = Math.min(video.videoHeight - sy, c.srcH + padY * 2);
    if (sw < 20 || sh < 10) return null;
    var scale = Math.min(2, 1100 / sw);
    if (sw * sh * scale * scale > 1500000) scale = Math.sqrt(1500000 / (sw * sh));
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(sw * scale)); canvas.height = Math.max(1, Math.round(sh * scale));
    canvas.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return canvas;
}

function makeFullFrame(){
    if (!video.videoWidth) return null;
    var s = Math.min(1, 1280 / video.videoWidth);
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(video.videoWidth * s); canvas.height = Math.round(video.videoHeight * s);
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas;
}

// ---- 바코드 ----
var zxReader = null, zxImgReader = null;
function zxHints(){
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return hints;
}
async function decodeBarcode(canvas){
    if (typeof ZXing === "undefined") return null;
    if (ZXing.HTMLCanvasElementLuminanceSource && ZXing.MultiFormatReader && ZXing.BinaryBitmap && ZXing.HybridBinarizer){
        try {
            if (!zxReader){ zxReader = new ZXing.MultiFormatReader(); zxReader.setHints(zxHints()); }
            var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas)));
            return zxReader.decode(bmp).getText();
        } catch(e) { return null; }
    }
    try {   // 라이브러리 구성이 다른 경우의 대체 경로
        var img = new Image(); img.src = canvas.toDataURL();
        await new Promise(function(r){ img.onload = r; img.onerror = r; });
        if (!zxImgReader) zxImgReader = new ZXing.BrowserMultiFormatReader(zxHints());
        return (await zxImgReader.decodeFromImageElement(img)).getText();
    } catch(e) { return null; }
}

// ---- 숫자(OCR): 엔진 1개를 만들어 계속 재사용 ----
var ocrWorkerPromise = null;
function getOcrWorker(){
    if (typeof Tesseract === "undefined") return Promise.reject(new Error("Tesseract 없음"));
    if (!ocrWorkerPromise){
        ocrWorkerPromise = Tesseract.createWorker("eng").then(async function(w){
            await w.setParameters({ tessedit_char_whitelist: "0123456789-", user_defined_dpi: "300" });
            return w;
        }).catch(function(e){ ocrWorkerPromise = null; throw e; });
    }
    return ocrWorkerPromise;
}

// 바코드 → 숫자 OCR(보정 방식 여러 가지) 순서로 시도. 재고 목록(캐시)에 있는 LOT이 나오면 바로 확정
async function recognizeLot(){
    var frame = makeCrop();
    if (!frame) return null;
    var votes = {};

    function consider(text, trusted){
        var lots = extractLots(text);
        for (var i = 0; i < lots.length; i++){
            var l = lots[i];
            if (lotInCache(l)) return l;
            if (lotPlausible(l)){
                if (trusted) return l;
                votes[l] = (votes[l] || 0) + 1;
            }
        }
        return null;
    }
    function bestVote(){
        var best = null, n = 0;
        for (var k in votes){ if (votes[k] > n){ n = votes[k]; best = k; } }
        return best;
    }

    status.innerHTML = "🔍 바코드 확인 중...";
    await nextTick();
    var lot = consider(await decodeBarcode(frame), true);
    if (lot) return lot;

    var gi = getGray(frame);
    var stretched = stretchGray(gi.g);
    var stretchedCanvas = grayToCanvas(stretched, gi.w, gi.h);
    lot = consider(await decodeBarcode(stretchedCanvas), true);
    if (lot) return lot;

    var full = makeFullFrame();
    if (full){
        lot = consider(await decodeBarcode(full), true);
        if (lot) return lot;
    }

    if (typeof Tesseract !== "undefined"){
        var bin = grayToCanvas(adaptiveBinarize(stretched, gi.w, gi.h), gi.w, gi.h);
        var passes = [ { c: stretchedCanvas, psm: "6" }, { c: bin, psm: "6" }, { c: bin, psm: "11" } ];
        for (var i = 0; i < passes.length; i++){
            status.innerHTML = "🔍 숫자 인식 중 (" + (i + 1) + "/" + passes.length + ")...";
            await nextTick();
            try {
                var w = await withTimeout(getOcrWorker(), 60000);
                await w.setParameters({ tessedit_pageseg_mode: passes[i].psm });
                var res = await withTimeout(w.recognize(passes[i].c), 15000);
                lot = consider(res && res.data ? res.data.text : "", false);
                if (lot) return lot;
            } catch(e) {
                console.error("숫자 인식 오류:", e);
                if (e && e.message === "timeout") ocrWorkerPromise = null;
            }
        }
    }
    return bestVote();
}

// ---- 연속 실패 처리: 3번 실패하면 직접 입력칸으로 커서 이동 ----
var recogFailCount = 0;
var capturing = false;

// ---- 직접 입력 시 키보드에 가리지 않도록 화면을 위로 올림 ----
var typingMode = false, scrolledForTyping = false;
function alignTyping(){
    if (!typingMode) return;
    var nav = document.querySelector(".navbar");
    var navH = nav ? nav.offsetHeight : 0;
    var y = status.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0) - navH - 6;
    window.scrollTo(0, Math.max(0, y));    // [상태 문구 + LOT 입력칸 + 조회 버튼]이 화면 맨 위에 오도록
    scrolledForTyping = true;
}
function bringTypingIntoView(){
    typingMode = true;
    document.body.classList.add("kb-open");   // 스크롤할 여백 확보 (페이지가 짧아도 올라갈 수 있게)
    alignTyping();
    setTimeout(alignTyping, 300);             // 키보드가 완전히 올라온 뒤 다시 맞춤
    setTimeout(alignTyping, 700);
}
resultInput.addEventListener("focus", bringTypingIntoView);
resultInput.addEventListener("blur", () => {
    typingMode = false;
    setTimeout(() => { if (!typingMode) document.body.classList.remove("kb-open"); }, 300);
});
if (window.visualViewport) window.visualViewport.addEventListener("resize", alignTyping);   // 키보드 크기 변화 시

// 직접 입력 후 수량 창이 닫히면 카메라 화면으로 복귀
function closeQtyModal(){
    qtyModalOverlay.style.display = "none";
    if (scrolledForTyping){ scrolledForTyping = false; window.scrollTo(0, 0); }
}


function handleRecognitionFail(){
    recogFailCount++;
    if (navigator.vibrate) navigator.vibrate(recogFailCount >= 3 ? [120, 80, 120] : 120);
    if (recogFailCount >= 3){
        recogFailCount = 0;
        status.innerHTML = "⌨️ 3회 연속 인식 실패 - LOT 번호를 직접 입력해주세요.";
        resultInput.value = "";
        resultInput.classList.add("attention");
        setTimeout(function(){ resultInput.classList.remove("attention"); }, 4000);
        resultInput.setAttribute("inputmode", "numeric");
        // 입력칸을 선택 + 커서까지 넣어서 휴대폰 키보드가 뜨도록 함
        resultInput.focus();
        try { resultInput.click(); } catch(e){}
        try { resultInput.select(); resultInput.setSelectionRange(0, resultInput.value.length); } catch(e){}
        bringTypingIntoView();
    } else {
        status.innerHTML = "❌ 인식 실패 (" + recogFailCount + "/3) - 초록 박스에 맞춰 다시 촬영해주세요.";
    }
}

captureBtn.onclick = async () => {
    if (capturing) return;
    if (!scannerInput.value.trim()) { alert("작성자 이름을 입력해주세요."); scannerInput.focus(); return; }
    if (!deptSelect.value) { alert("실사 부서를 선택해주세요."); deptSelect.focus(); return; }
    if (!video.videoWidth) { status.innerHTML = "⚠️ 카메라 준비 중입니다."; return; }

    // iOS는 터치 직후가 아니면 키보드를 못 띄우므로, 3번째 시도일 때 터치 순간에 숨은 입력칸으로 숫자 키보드를 미리 올려둠
    // (실패하면 handleRecognitionFail에서 LOT 입력칸으로 포커스만 옮겨서 키보드가 유지됨)
    var kbProxy = document.getElementById("kbProxy");
    if (recogFailCount >= 2) {
        try { kbProxy.focus({ preventScroll: true }); } catch(e){}
        bringTypingIntoView();   // 키보드가 올라오는 것과 동시에 화면도 위로 올림 (키보드 애니메이션 중에도 visualViewport resize로 계속 맞춤)
    }

    capturing = true; captureBtn.disabled = true;
    status.innerHTML = "🔍 인식 중...";
    try {
        var lot = null;
        try { lot = await recognizeLot(); } catch(e) { console.error(e); }
        if (lot) {
            recogFailCount = 0;
            resultInput.value = lot;
            await doLookup(lot);
        } else {
            handleRecognitionFail();
        }
    } finally {
        if (document.activeElement === kbProxy) {   // 인식 성공 등으로 입력칸이 안 열렸으면 키보드 닫고 화면 원위치
            kbProxy.blur();
            typingMode = false;
            setTimeout(function(){ if (!typingMode) document.body.classList.remove("kb-open"); }, 300);
            if (scrolledForTyping){ scrolledForTyping = false; window.scrollTo(0, 0); }
            try { var pr = video.play(); if (pr && pr.catch) pr.catch(function(){}); } catch(e){}
        }
        capturing = false;
        captureBtn.disabled = !(window.cachedStockMap && window.cachedStockMap.size > 0);
    }
};

resultInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); recheckBtn.click(); }
});

recheckBtn.onclick = async () => {
    recogFailCount = 0;
    const lot = resultInput.value.trim();
    if (!lot) return alert("LOT 번호를 입력하세요.");
    await doLookup(lot);
};

async function doLookup(lot){
    status.innerHTML = "🔎 조회 중...";
    let res;
    try { res = await window.apiLookup(lot); }
    catch(e){ console.error(e); status.innerHTML = "❌ 조회 실패 - 네트워크를 확인하고 다시 시도하세요."; return; }
    currentLookupResult = res;
    if (window.updateProgressBar) window.updateProgressBar();
    lotInfoBox.style.display = "block";

    if (res.found) {
        let statusBadge = res.isRecent1Day 
            ? `<div class="status-tag yes">✅ 최근 1일(당일) 재고 데이터 존재</div>` 
            : `<div class="status-tag warn">⚠️ 최근 1일 데이터 없음 (10일 이내 등록품목 → 수량 0)</div>`;

        lotInfoBox.className = "found";
        lotInfoBox.innerHTML = `
            ${statusBadge}
            <div class="info-grid">
                <div class="info-label">품번</div><div class="info-value">${res.item_no}</div>
                <div class="info-label">품명</div><div class="info-value">${res.item_name}</div>
                <div class="info-label">전산수량</div><div class="info-value big">${res.qty} ${res.unit}</div>
            </div>
            <button id="openQtyModalBtn">📝 실수량 입력하기</button>
        `;
        status.innerHTML = "✅ 조회 완료. 실수량을 입력하세요.";

        document.getElementById("openQtyModalBtn").onclick = () => openQtyModal(res);
        openQtyModal(res);
    } else {
        lotInfoBox.className = "notfound";
        lotInfoBox.innerHTML = `
            <div class="status-tag no">⚠️ 최근 10일 재고 데이터 없음</div>
            <div class="info-grid">
                <div class="info-label">LOT</div><div class="info-value">${lot}</div>
            </div>
            <div style="margin-top:8px;color:#ff8a8a;font-size:12px;">최근 10일 이내 업로드된 재고 리스트에 존재하지 않습니다.</div>
        `;
        status.innerHTML = "⚠️ 재고 데이터 없음";
    }
}

function openQtyModal(res) {
    modalLotNo.innerText = res.lot_no || '-';
    modalItemNo.innerText = res.item_no || '-';
    modalItemName.innerText = res.item_name || '-';
    modalSysQty.innerText = `${res.qty} ${res.unit || ''}`;
    
    modalQtyInput.value = "";
    modalMsg.innerText = "";
    qtyModalOverlay.style.display = "flex";
    setTimeout(() => modalQtyInput.focus(), 100);
}

modalCloseBtn.onclick = () => closeQtyModal();

// 📌 보완된 수량 저장 버튼 클릭 로직
modalSaveBtn.onclick = async () => {
    const val = modalQtyInput.value;
    if (val === "") return alert("실수량을 입력해 주세요.");
    if (!currentLookupResult) return;

    // 네트워크 끊김 상태 감지 시 사전 예외 처리
    if (!navigator.onLine) {
        modalMsg.innerHTML = "<span style='color:#ffb84d;'>⚠️ 현재 오프라인 상태입니다. 신호가 잡히는 곳에서 '저장'을 다시 눌러주세요.</span>";
        return;
    }

    modalMsg.innerHTML = "<span style='color:#4fc3ff;'>저장 중...</span>";
    let saveRes;
    try { 
        saveRes = await window.apiSaveQty(currentLookupResult.lot_no, val, currentLookupResult.qty); 
    } catch(e) { 
        console.error(e); 
        // 전송 실패 시 모달 창을 닫지 않고 입력값과 상태 유지
        modalMsg.innerHTML = "<span style='color:#ff8a8a;'>❌ 통신이 불안정합니다. 창을 닫지 말고 잠시 후 '저장'을 다시 눌러주세요.</span>"; 
        return; 
    }
    
    modalMsg.innerHTML = `<span style="color:#00e676;">✅ 저장 완료 (차이: ${saveRes.diff})</span>`;
    setTimeout(() => { closeQtyModal(); }, 600);
};

// 📌 네트워크 상태 실시간 표시 및 UI 업데이트
function updateNetworkUI() {
    const statusDiv = document.getElementById('networkStatus');
    if (!statusDiv) return;
    
    if (navigator.onLine) {
        statusDiv.innerHTML = "🟢 온라인 (데이터 저장 가능)";
        statusDiv.style.color = "#00e676";
    } else {
        statusDiv.innerHTML = "🔴 오프라인 (신호 미약 - 인터넷 이동 필요)";
        statusDiv.style.color = "#ff8a8a";
    }
}

window.addEventListener('online', updateNetworkUI);
window.addEventListener('offline', updateNetworkUI);
updateNetworkUI();
