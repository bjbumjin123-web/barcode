<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, updateDoc, doc,
    getDocs, query, where, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAGIPNxEoMs9yYuQV8gP2PG09bb_F23DrQ",
    authDomain: "lot-bar.firebaseapp.com",
    projectId: "lot-bar",
    storageBucket: "lot-bar.firebasestorage.app",
    messagingSenderId: "905334285763",
    appId: "1:905334285763:web:53569a62031006a611c976"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const STOCK_COL = "lot_stock";
const LOG_COL = "lot_scan_log";

window.cachedStockMap = new Map();

// 날짜 유연 비교 보조 함수 (특수문자 제거 후 8자리 숫자만 추출하여 비교)
function cleanDate8Digits(str) {
    if (!str) return '';
    const digits = String(str).replace(/[^0-9]/g, '');
    return digits.substring(0, 8);
}

window.download10DaysStock = async function(){
    const status = document.getElementById("status");
    status.innerHTML = "⏳ 최근 10일치 재고 데이터 다운로드 중...";
    try {
        const snap = await getDocs(query(collection(db, STOCK_COL), orderBy('upload_date','desc'), limit(2000)));
        window.cachedStockMap.clear();
        let count = 0;
        snap.forEach(d => {
            const data = d.data();
            if (data.lot_no) {
                if (!window.cachedStockMap.has(data.lot_no)) {
                    window.cachedStockMap.set(data.lot_no, data);
                    count++;
                }
            }
        });
        status.innerHTML = `✅ 재고 데이터 ${count}건 다운로드 완료!`;
        return { success: true, count };
    } catch(e) {
        console.error(e);
        status.innerHTML = "❌ 재고 다운로드 실패. 네트워크를 확인하세요.";
        return { success: false };
    }
};

function nowParts(){
    const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    });
    const map = {};
    fmt.formatToParts(new Date()).forEach(p => map[p.type] = p.value);
    const date = `${map.year}-${map.month}-${map.day}`;
    const time = `${map.hour}:${map.minute}:${map.second}`;
    return { date, datetime: `${date} ${time}` };
}

window.apiLookup = async function(lot){
    lot = (lot || '').trim();
    if (!lot) return { found:false, error:'LOT 번호가 없습니다.' };

    const scanner = document.getElementById("scannerInput").value.trim();
    const scanDept = document.getElementById("deptSelect").value;

    let stockRow = window.cachedStockMap.get(lot);
    if (!stockRow) {
        const stockSnap = await getDocs(query(collection(db, STOCK_COL), where('lot_no','==',lot)));
        let rows = [];
        stockSnap.forEach(d => rows.push(d.data()));
        if (rows.length > 0) {
            rows.sort((a,b) => (a.upload_date < b.upload_date ? 1 : -1));
            stockRow = rows[0];
        }
    }

    const { date: today, datetime: now } = nowParts();
    await addDoc(collection(db, LOG_COL), {
        lot_no: lot, scan_date: today, scanned_at: now,
        scanned_by: scanner, scan_dept: scanDept,
        actual_qty: null, diff: null
    });

    if (!stockRow) {
        return { found: false, lot_no: lot };
    }

    // 날짜 포맷 차이 완벽 호환 (YYYYMMDD 8자리 유연 비교)
    const todayNum = cleanDate8Digits(today);
    const uploadNum = cleanDate8Digits(stockRow.upload_date);
    const isRecent1Day = (uploadNum !== '' && uploadNum === todayNum);

    return {
        found: true,
        isRecent1Day: isRecent1Day,
        lot_no: lot,
        item_no: stockRow.item_no || '-',
        item_name: stockRow.item_name || '-',
        qty: Number(stockRow.qty || 0),
        unit: stockRow.unit || '',
        upload_date: stockRow.upload_date || '-'
    };
};

window.apiSaveQty = async function(lot, actualQtyRaw, systemQty){
    const actualQty = Math.round(Number(actualQtyRaw));
    const diff = actualQty - systemQty;
    const { date: today, datetime: now } = nowParts();

    const logSnap = await getDocs(query(collection(db, LOG_COL), where('lot_no','==',lot), where('scan_date','==',today)));
    let logRows = [];
    logSnap.forEach(d => logRows.push({ id: d.id, ...d.data() }));
    logRows.sort((a,b) => (a.scanned_at > b.scanned_at ? -1 : 1));
    const target = logRows[0];

    if (target){
        await updateDoc(doc(db, LOG_COL, target.id), { actual_qty: actualQty, diff: diff });
    } else {
        await addDoc(collection(db, LOG_COL), {
            lot_no: lot, scan_date: today, scanned_at: now, actual_qty: actualQty, diff: diff
        });
    }

    return { success: true, actual_qty: actualQty, diff };
};
</script>

<script>
const scannerInput = document.getElementById("scannerInput");
const deptSelect = document.getElementById("deptSelect");
const startDataBtn = document.getElementById("startDataBtn");

const status = document.getElementById("status");

const camWrap = document.getElementById("camWrap");
const zoomInBtn = document.getElementById("zoomIn");
const zoomOutBtn = document.getElementById("zoomOut");
const zoomLabel = document.getElementById("zoomLabel");
const torchBtn = document.getElementById("torchBtn");

const qtyModalOverlay = document.getElementById("qtyModalOverlay");
const modalLotNo = document.getElementById("modalLotNo");
const modalItemNo = document.getElementById("modalItemNo");
const modalItemName = document.getElementById("modalItemName");
const modalSysQty = document.getElementById("modalSysQty");
const modalQtyInput = document.getElementById("modalQtyInput");
const modalSaveBtn = document.getElementById("modalSaveBtn");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const modalMsg = document.getElementById("modalMsg");

let currentZoom = 1;
let videoTrack = null;
let torchOn = false;
let currentLookupResult = null;

(function restoreSavedInfo() {
    const savedScanner = localStorage.getItem("lot_scanner_name");
    const savedDept = localStorage.getItem("lot_scanner_dept");
    if (savedScanner) scannerInput.value = savedScanner;
    if (savedDept) deptSelect.value = savedDept;
})();

scannerInput.addEventListener("input", () => localStorage.setItem("lot_scanner_name", scannerInput.value.trim()));
deptSelect.addEventListener("change", () => localStorage.setItem("lot_scanner_dept", deptSelect.value));

startDataBtn.onclick = async () => {
    await window.download10DaysStock();
    captureBtn.disabled = false;
};

resultInput.addEventListener("input", function() {
    let raw = resultInput.value.replace(/[^0-9-]/g, '');
    let nums = raw.replace(/-/g, '');
    if (nums.length > 13) nums = nums.slice(0, 13);
    
    if (nums.length > 10) {
        resultInput.value = nums.slice(0, 10) + '-' + nums.slice(10);
    } else {
        resultInput.value = nums;
    }
});

async function initCamera(){
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        document.getElementById("camStatus").style.display = "none";
    } catch(e) {
        document.getElementById("camStatus").innerText = "⚠️ 카메라 사용 불가";
    }
}
initCamera();

function setZoom(val) {
    currentZoom = Math.max(1, Math.min(10, val));
    zoomLabel.innerText = currentZoom.toFixed(1) + "x";
    if (videoTrack) {
        try { videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] }); } catch(e) { video.style.transform = `scale(${currentZoom})`; }
    } else {
        video.style.transform = `scale(${currentZoom})`;
    }
}

zoomInBtn.onclick = () => setZoom(currentZoom + 0.5);
zoomOutBtn.onclick = () => setZoom(currentZoom - 0.5);

let initialPinchDist = null;
let initialZoomOnPinch = 1;

camWrap.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialZoomOnPinch = currentZoom;
    }
}, { passive: true });

camWrap.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && initialPinchDist) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        setZoom(initialZoomOnPinch * (dist / initialPinchDist));
    }
}, { passive: true });

camWrap.addEventListener("touchend", (e) => {
    if (e.touches.length < 2) initialPinchDist = null;
});

torchBtn.onclick = async () => {
    if (!videoTrack) return;
    torchOn = !torchOn;
    try {
        await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
        torchBtn.classList.toggle("on", torchOn);
    } catch(e) { alert("이 기기에서는 플래시를 지원하지 않습니다."); }
};

const codeReader = new ZXing.BrowserMultiFormatReader();
captureBtn.onclick = async () => {
    if (!scannerInput.value.trim()) { alert("작성자 이름을 입력해주세요."); scannerInput.focus(); return; }
    if (!deptSelect.value) { alert("실사 부서를 선택해주세요."); deptSelect.focus(); return; }

    status.innerHTML = "🔍 인식 진행 중...";
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    let lot = null;
    try {
        let img = new Image(); img.src = canvas.toDataURL();
        await new Promise(r => img.onload = r);
        lot = (await codeReader.decodeFromImageElement(img)).getText();
    } catch(e) {
        let { data: { text } } = await Tesseract.recognize(canvas.toDataURL(), 'eng');
        let match = text.replace(/\s+/g, '').match(/\d{10}-\d{3}/);
        if (match) lot = match[0];
    }

    if (lot) {
        resultInput.value = lot;
        await doLookup(lot);
    } else {
        status.innerHTML = "❌ 인식 실패. 손으로 직접 입력해주세요.";
    }
};

recheckBtn.onclick = async () => {
    const lot = resultInput.value.trim();
    if (!lot) return alert("LOT 번호를 입력하세요.");
    await doLookup(lot);
};

async function doLookup(lot){
    status.innerHTML = "🔎 조회 중...";
    const res = await window.apiLookup(lot);
    currentLookupResult = res;
    lotInfoBox.style.display = "block";

    if (res.found) {
        let statusBadge = res.isRecent1Day 
            ? `<div class="status-tag yes">✅ 최근 1일(당일) 재고 데이터 존재</div>` 
            : `<div class="status-tag warn">⚠️ 최근 1일 데이터 없음 (10일 이내 등록품목 → 수량 0)</div>`;

        lotInfoBox.className = "found";
        lotInfoBox.innerHTML = `
            ${statusBadge}
            <div class="info-grid">
                <div class="info-label">품번</div><div class="info-value">${res.item_no}</div>
                <div class="info-label">품명</div><div class="info-value">${res.item_name}</div>
                <div class="info-label">전산수량</div><div class="info-value big">${res.qty} ${res.unit}</div>
            </div>
            <button id="openQtyModalBtn">📝 실수량 입력하기</button>
        `;
        status.innerHTML = "✅ 조회 완료. 실수량을 입력하세요.";

        document.getElementById("openQtyModalBtn").onclick = () => openQtyModal(res);
        openQtyModal(res);
    } else {
        lotInfoBox.className = "notfound";
        lotInfoBox.innerHTML = `
            <div class="status-tag no">⚠️ 최근 10일 재고 데이터 없음</div>
            <div class="info-grid">
                <div class="info-label">LOT</div><div class="info-value">${lot}</div>
            </div>
            <div style="margin-top:8px;color:#ff8a8a;font-size:12px;">최근 10일 이내 업로드된 재고 리스트에 존재하지 않습니다.</div>
        `;
        status.innerHTML = "⚠️ 재고 데이터 없음";
    }
}

// 📌 4줄로 세분화하여 모달에 개별 출력 (LOT / 품번 / 품명 / 전산수량)
function openQtyModal(res) {
    modalLotNo.innerText = res.lot_no || '-';
    modalItemNo.innerText = res.item_no || '-';
    modalItemName.innerText = res.item_name || '-';
    modalSysQty.innerText = `${res.qty} ${res.unit || ''}`;
    
    modalQtyInput.value = "";
    modalMsg.innerText = "";
    qtyModalOverlay.style.display = "flex";
    setTimeout(() => modalQtyInput.focus(), 100);
}

modalCloseBtn.onclick = () => qtyModalOverlay.style.display = "none";

modalSaveBtn.onclick = async () => {
    const val = modalQtyInput.value;
    if (val === "") return alert("실수량을 입력해 주세요.");
    if (!currentLookupResult) return;

    modalMsg.innerHTML = "<span style='color:#4fc3ff;'>저장 중...</span>";
    const saveRes = await window.apiSaveQty(currentLookupResult.lot_no, val, currentLookupResult.qty);
    
    modalMsg.innerHTML = `<span style="color:#00e676;">✅ 저장 완료 (차이: ${saveRes.diff})</span>`;
    setTimeout(() => {
        qtyModalOverlay.style.display = "none";
    }, 600);
};
</script>
</body>
</html>
