<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스캔 기록</title>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:-apple-system,"Malgun Gothic",Arial,sans-serif;background:#111;color:#eee;margin:0;padding:16px;}
h2{font-size:16px;text-align:center;margin:0 0 12px;white-space:nowrap;}
.navbar{display:flex;justify-content:center;gap:4px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;}
.navbar a{color:#4fc3ff;font-size:12px;letter-spacing:-0.3px;text-decoration:none;padding:5px 6px;border:1px solid #2a4a5c;border-radius:10px;white-space:nowrap;}
.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
input[type=date], input[type=text], select{padding:6px;background:#1c1c1c;color:#eee;border:1px solid #444;border-radius:6px;font-size:12px;letter-spacing:-0.3px;white-space:nowrap;flex:0 0 auto;}
button{padding:6px 10px;font-size:12px;letter-spacing:-0.3px;font-weight:bold;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;flex:0 0 auto;}
.btn-export{background:#4fc3ff;color:#111;}
.summary{display:flex;gap:12px;margin-bottom:12px;font-size:13px;color:#4fc3ff;flex-wrap:nowrap;overflow-x:auto;}
.summary div {white-space:nowrap;}
.live-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#00e676;margin-left:6px;vertical-align:middle;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#00e676;animation:pulse 1.5s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}}
table{width:100%;border-collapse:collapse;font-size:13px;background:#1c1c1c;border-radius:8px;overflow:hidden;}
th, td{padding:8px 10px;border-bottom:1px solid #2a2a2a;text-align:left;white-space:nowrap;}
th{background:#222;color:#aaa;font-size:12px;}
tr.dup{background:rgba(255,184,77,0.10);}
.dup-badge{color:#ffb84d;font-weight:bold;}
.diff-bad{color:#ff8a8a;font-weight:bold;}
.diff-ok{color:#00e676;}
.empty{padding:30px;text-align:center;color:#888;}
.scroll-wrap{overflow-x:auto;}
.close-row td{background:rgba(255,184,77,0.15);color:#ffb84d;font-weight:bold;}
.start-row td{background:rgba(79,195,255,0.13);color:#4fc3ff;font-weight:bold;}
</style>
</head>
<body>

<h2>🕒 스캔 기록</h2>

<div class="navbar">
<a href="index.html">📸 스캔</a>
<a href="upload.html">📂 업로드</a>
<a href="progress.html">📋 진행률</a>
<a href="history.html">📅 이력조회</a>
</div>

<div class="toolbar">
<input type="date" id="dateInput">
<select id="deptSelect"><option value="">전체 부서</option></select>
<input type="text" id="qLot" placeholder="LOT 검색" style="width:100px;">
<input type="text" id="qItem" placeholder="품번/품명" style="width:90px;">
<input type="text" id="qWh" placeholder="창고" style="width:70px;">
<button class="btn-export" id="refreshBtn">🔄 새로고침</button>
<button class="btn-export" id="exportBtn">📥 다운로드</button>
</div>

<div class="summary" id="summaryBox"></div>

<div id="content"><div class="empty">불러오는 중...</div></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb = createClient("https://siwaynipvwtwuoobyarp.supabase.co", "sb_publishable_lEKhT8TYzo368Hxfd0E8-Q_D9JEyO9Z");

// Firestore 스냅샷처럼 d.data() 로 읽을 수 있게 감싸는 도우미 (기존 코드 호환용)
const wrap = r => ({ id: r.id, data: () => r });

// Supabase는 한 번에 1000행까지만 주므로 나눠서 전부 가져옴
async function fetchAll(build){
    const out = [];
    for (let from = 0; ; from += 1000){
        const { data, error } = await build().order('id').range(from, from + 999);
        if (error) throw error;
        data.forEach(r => out.push(wrap(r)));
        if (data.length < 1000) break;
    }
    return out;
}


function todayKST(){
    const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit" });
    return fmt.format(new Date());
}

const STOCK_COL = "stock";
const LOG_COL = "scan_log";
const CLOSE_LOG_COL = "close_log";

const dateInput = document.getElementById("dateInput");
const deptSelect = document.getElementById("deptSelect");
const qLot = document.getElementById("qLot");
qLot.addEventListener("input", () => {
    let digits = qLot.value.replace(/\D/g, '').slice(0, 13);
    qLot.value = digits.length > 10 ? digits.slice(0, 10) + '-' + digits.slice(10) : digits;
});
const qItem = document.getElementById("qItem");
const qWh = document.getElementById("qWh");
const exportBtn = document.getElementById("exportBtn");
const summaryBox = document.getElementById("summaryBox");
const content = document.getElementById("content");

dateInput.value = todayKST();

let stockByLot = {};
let dateLogs = [];

function esc(s){
    if (s === null || s === undefined) return '';
    return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 성능 개선: 부서는 lot_daily_snapshot.py의 classify_department()가 만드는 고정된 값들이라
// 매번 전체 컬렉션을 긁어서 알아낼 필요 없이 목록을 그대로 씀
const DEPARTMENTS = ["1F(가공생산)", "2F(검사/포장)", "미분류", "영업", "외주", "자재", "주조"];
function loadDepartments(){
    DEPARTMENTS.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = d;
        deptSelect.appendChild(opt);
    });
}

async function loadStockMap(){
    // 성능 개선: lot_stock 전체 이력을 다 긁지 않고, 최신(master) 날짜분만 조회
    const { data: top, error: topErr } = await sb.from(STOCK_COL).select('upload_date').order('upload_date', { ascending:false }).limit(1);
    if (topErr) throw topErr;
    const masterSnap = top.map(wrap);
    let masterDate = null;
    masterSnap.forEach(d => { masterDate = d.data().upload_date; });
    if (!masterDate) { stockByLot = {}; return; }

    const snap = await fetchAll(() => sb.from(STOCK_COL).select('*').eq('upload_date', masterDate));
    stockByLot = {};
    snap.forEach(d => {
        const r = d.data();
        const existing = stockByLot[r.lot_no];
        if (!existing) { stockByLot[r.lot_no] = r; return; }
        const runAt = r.run_at || r.uploaded_at || '';
        const existingRunAt = existing.run_at || existing.uploaded_at || '';
        if (runAt > existingRunAt) stockByLot[r.lot_no] = r;
    });
}

let dateCloseLogs = [];

function buildTimeline(){
    const sorted = [...dateLogs].sort((a,b) => (a.scanned_at > b.scanned_at ? 1 : -1));

    const seqCounter = {};
    sorted.forEach(r => {
        seqCounter[r.lot_no] = (seqCounter[r.lot_no] || 0) + 1;
        r.seq_no = seqCounter[r.lot_no];
    });

    let scanRows = sorted.map(r => {
        const item = stockByLot[r.lot_no] || { item_no:'', item_name:'(재고 데이터 없음)', qty:null, unit:'', warehouse:'', department:null, subcontract_type:null };
        return {
            type: 'scan', time: r.scanned_at,
            lot_no:r.lot_no, item_no:item.item_no, item_name:item.item_name, qty:item.qty, unit:item.unit,
            warehouse:item.warehouse, department:item.department, subcontract_type:item.subcontract_type,
            scan_dept:r.scan_dept, scanned_at:r.scanned_at, seq_no:r.seq_no,
            actual_qty: (r.actual_qty === null || r.actual_qty === undefined) ? null : Number(r.actual_qty),
            diff: (r.diff === null || r.diff === undefined) ? null : Number(r.diff),
            scanned_by:r.scanned_by,
            is_historical: !!r.is_historical, historical_date: r.historical_date || null
        };
    });

    const fLot = qLot.value.trim(), fItem = qItem.value.trim(), fWh = qWh.value.trim(), fDept = deptSelect.value;
    if (fLot) scanRows = scanRows.filter(r => r.lot_no.indexOf(fLot) !== -1);
    if (fItem) scanRows = scanRows.filter(r => (r.item_no+' '+r.item_name+' '+(r.is_historical ? '과거자료 '+r.historical_date+' 참고' : '')).indexOf(fItem) !== -1);
    if (fWh) scanRows = scanRows.filter(r => (r.warehouse||'').indexOf(fWh) !== -1);
    if (fDept) scanRows = scanRows.filter(r => (r.department||'') === fDept);

    let closeRows = dateCloseLogs.map(r => ({
        type: 'close', time: r.closed_at, event: r.event || 'close',
        scanner: r.scanner, dept: r.dept, checked: r.checked, total: r.total, remaining: r.remaining
    }));
    if (fLot || fItem || fWh) closeRows = [];
    if (fDept) closeRows = closeRows.filter(r => r.dept === fDept);

    const combined = [...scanRows, ...closeRows];
    combined.sort((a,b) => (a.time < b.time ? 1 : -1));
    return combined;
}

function render(){
    const rows = buildTimeline();
    const scanOnly = rows.filter(r => r.type === 'scan');

    const totalScans = dateLogs.length;
    const uniqueLots = new Set(dateLogs.map(r => r.lot_no)).size;
    const dupCount = scanOnly.filter(r => r.seq_no > 1).length;

    summaryBox.innerHTML = `<div>총 스캔 횟수: <b>${totalScans}</b>회</div><div>확인된 LOT 종류: <b>${uniqueLots}</b>개</div><div>중복 확인: <b class="dup-badge">${dupCount}</b>건</div>`;

    if (!rows.length){
        content.innerHTML = '<div class="empty">이 날짜에는 스캔 기록이 없습니다.</div>';
        return;
    }

    let html = '<div class="scroll-wrap"><table><thead><tr><th>#</th><th>확인시각</th><th>확인자</th><th>확인부서</th><th>LOT NO</th><th>부서</th><th>품번</th><th>품명</th><th>시스템수량</th><th>실제수량</th><th>차이</th><th>창고</th><th>확인횟수</th><th>비고</th></tr></thead><tbody>';

    rows.forEach((r,i) => {
        if (r.type === 'close'){
            const who = `<b>${esc(r.scanner || '-')}</b>${r.dept ? ' ('+esc(r.dept)+')' : ' (전체 부서)'}`;
            const hasCounts = r.checked !== null && r.checked !== undefined;
            if (r.event === 'start'){
                html += `<tr class="start-row">
                    <td>${i+1}</td>
                    <td>${esc((r.time||'').toString().slice(11,19))}</td>
                    <td colspan="12">▶️ 시작 · ${who}${r.total !== null && r.total !== undefined ? ' · 재고 '+esc(r.total)+'건 다운로드' : ''}</td>
                </tr>`;
            } else {
                html += `<tr class="close-row">
                    <td>${i+1}</td>
                    <td>${esc((r.time||'').toString().slice(11,19))}</td>
                    <td colspan="12">🏁 마감 · ${who}${hasCounts ? ' · 확인 '+esc(r.checked)+'/'+esc(r.total)+'건 · 남음 '+esc(r.remaining)+'건' : ' · 남은 LOT 확인 못함'}</td>
                </tr>`;
            }
            return;
        }

        const mismatch = r.diff !== null && r.diff !== 0;
        const deptMismatch = r.scan_dept && r.department && r.scan_dept !== r.department;
        const diffText = r.diff !== null ? (r.diff > 0 ? '+'+r.diff : r.diff) : '-';
        const diffClass = mismatch ? 'diff-bad' : (r.diff === 0 ? 'diff-ok' : '');
        const seqText = r.seq_no > 1 ? `<span class="dup-badge">${r.seq_no}번째 (중복)</span>` : '1번째';

        html += `<tr class="${r.seq_no>1?'dup':''}">
            <td>${i+1}</td>
            <td>${esc((r.scanned_at||'').toString().slice(11,19))}</td>
            <td>${esc(r.scanned_by||'-')}</td>
            <td class="${deptMismatch?'diff-bad':''}">${esc(r.scan_dept||'-')}</td>
            <td>${esc(r.lot_no)}</td>
            <td>${esc(r.department||'-')}${r.subcontract_type?' ('+esc(r.subcontract_type)+')':''}</td>
            <td>${esc(r.item_no)}</td>
            <td>${esc(r.item_name)}</td>
            <td>${r.qty !== null ? esc(r.qty)+' '+esc(r.unit) : '-'}</td>
            <td>${r.actual_qty !== null ? esc(r.actual_qty) : '-'}</td>
            <td class="${diffClass}">${diffText}</td>
            <td>${esc(r.warehouse||'-')}</td>
            <td>${seqText}</td>
            <td>${r.is_historical ? `<span style="display:inline-block;padding:2px 6px;border:1px solid #ffb84d;border-radius:6px;color:#ffb84d;font-weight:bold;">과거자료(${esc(r.historical_date)}) 참고</span>` : '-'}</td>
        </tr>`;
    });

    html += '</tbody></table></div>';
    content.innerHTML = html;
}

function friendlyErrorMessage(e){
    const msg = ((e && e.code) || (e && e.message) || '').toString().toLowerCase();
    if (msg.includes('resource-exhausted') || msg.includes('quota') || msg.includes('429')){
        return '❗ 오늘 조회 한도 초과 - 잠시 후(리셋 후) 다시 시도해주세요.';
    }
    return '❌ 불러오기 실패 (콘솔 확인 필요)';
}

async function loadData(){
    content.innerHTML = '<div class="empty">불러오는 중...</div>';
    try {
        await loadStockMap();

        const logSnap = await fetchAll(() => sb.from(LOG_COL).select('*').eq('scan_date', dateInput.value));
        dateLogs = [];
        logSnap.forEach(d => dateLogs.push(d.data()));

        const closeSnap = await fetchAll(() => sb.from(CLOSE_LOG_COL).select('*').eq('scan_date', dateInput.value));
        dateCloseLogs = [];
        closeSnap.forEach(d => dateCloseLogs.push(d.data()));

        render();
    } catch(e){
        console.error(e);
        content.innerHTML = `<div class="empty">${friendlyErrorMessage(e)}</div>`;
    }
}

// 성능 개선: 화면을 켜둔 채 방치해도(5분간 조작 없음) 계속 조회가 나가지 않도록 스캔 화면으로 자동이동
let idleTimer = null;
function resetIdleTimer(){
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { location.href = "index.html"; }, 5 * 60 * 1000);
}
['click','touchstart','keydown'].forEach(evt => document.addEventListener(evt, resetIdleTimer));
resetIdleTimer();

exportBtn.onclick = () => {
    const timeline = buildTimeline();
    const rows = [['#','확인시각','확인자','확인부서','LOT NO','부서','외주구분','품번','품명','시스템수량','실제수량','차이','단위','창고','확인횟수','비고']];
    timeline.forEach((r,i) => {
        if (r.type === 'close'){
            const note = r.event === 'start'
                ? `시작${r.total !== null && r.total !== undefined ? ' · 재고 '+r.total+'건 다운로드' : ''}`
                : (r.checked !== null && r.checked !== undefined ? `마감 · 확인 ${r.checked}/${r.total}건 · 남음 ${r.remaining}건` : '마감');
            rows.push([
                i+1, r.time, r.scanner, r.dept, '', '', '', '', '', '', '', '', '', '',
                '', note
            ]);
            return;
        }
        rows.push([
            i+1, r.scanned_at, r.scanned_by, r.scan_dept, r.lot_no, r.department, r.subcontract_type,
            r.item_no, r.item_name, r.qty, r.actual_qty, r.diff, r.unit, r.warehouse,
            r.seq_no > 1 ? r.seq_no + '번째 (중복)' : '1번째',
            r.is_historical ? `과거자료(${r.historical_date}) 참고` : ''
        ]);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, dateInput.value);
    XLSX.writeFile(wb, `실사스캔기록_${dateInput.value}.xlsx`);
};

document.getElementById("refreshBtn").onclick = loadData;
dateInput.addEventListener("change", loadData);
[qLot, qItem, qWh, deptSelect].forEach(el => el.addEventListener("input", render));
deptSelect.addEventListener("change", render);

let userPickedDate = false;

loadDepartments();
loadData();

dateInput.addEventListener("change", () => { userPickedDate = true; });

setInterval(() => {
    if (userPickedDate) return;
    const todayNow = todayKST();
    if (dateInput.value !== todayNow){
        dateInput.value = todayNow;
        loadData();
    }
}, 60000);
</script>

</body>
</html>
