<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고조사 LOT 스캐너</title>
    
    <!-- OCR (Tesseract.js) & 바코드 (ZXing) CDN -->
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Malgun Gothic', -apple-system, sans-serif; }
        body { background-color: #121212; color: #ffffff; margin: 0; padding: 12px; }
        .app-container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 70px; }

        /* 헤더 및 입력 폼 */
        .header { text-align: center; font-size: 1.2em; font-weight: bold; padding: 2px 0; color: #00e676; }
        
        .form-input { width: 100%; padding: 10px; background-color: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 6px; font-size: 0.95em; outline: none; }
        .form-input:focus { border-color: #00e676; }
        select.form-input { color: #00e676; font-weight: bold; }

        /* 카메라 영역 */
        .camera-container { position: relative; width: 100%; height: 160px; background-color: #000; border-radius: 8px; border: 1px solid #333; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        
        .guide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .guide-text { color: #00e676; font-size: 0.8em; font-weight: bold; margin-bottom: 4px; text-shadow: 0 0 4px #000; }
        .guide-box { width: 85%; height: 45px; border: 2px solid #00e676; border-radius: 10px; box-shadow: 0 0 8px rgba(0,230,118,0.5); }

        /* 카메라 제어 패널 (줌 & 후레시) */
        .camera-controls { display: flex; gap: 6px; align-items: center; background: #1e1e1e; padding: 6px 10px; border-radius: 6px; border: 1px solid #333; font-size: 0.8em; }
        .btn-torch { background-color: #333; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; }
        .zoom-area { display: flex; align-items: center; gap: 6px; flex: 2; color: #aaa; }
        .zoom-area input[type=range] { width: 100%; accent-color: #00e676; cursor: pointer; }

        /* 버튼 스타일 */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-scan { background-color: #2e7d32; color: #ffffff; }
        .btn-scan:active { background-color: #1b5e20; }

        /* 상태 메세지 */
        .status-bar { text-align: center; font-size: 0.8em; padding: 6px; border-radius: 4px; background-color: #1b2e1e; color: #00e676; border: 1px solid #2e4d32; word-break: break-all; }

        /* 수동 입력 줄 */
        .search-row { display: flex; gap: 6px; }
        .input-lot { flex: 1; padding: 9px; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 0.9em; font-weight: bold; }
        .btn-add { width: 75px; background-color: #38bdf8; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* 내 폰 저장 목록 테이블 */
        .local-list-header { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; font-size: 0.85em; color: #aaa; }
        .badge-count { background-color: #00e676; color: #000; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.85em; }
        
        .table-area { max-height: 150px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; background-color: #1a1a1a; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8em; text-align: center; }
        th, td { border-bottom: 1px solid #2a2a2a; padding: 6px 4px; }
        th { background-color: #242424; color: #888; position: sticky; top: 0; }
        .btn-del { background: #ff5252; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; cursor: pointer; }

        /* 하단 고정 스티키 메인 버튼 */
        .sticky-footer { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #121212; padding: 8px 12px; border-top: 1px solid #222; box-shadow: 0 -4px 10px rgba(0,0,0,0.7); z-index: 99; display: flex; justify-content: center; }
        .sticky-footer .btn { max-width: 480px; font-size: 1.05em; padding: 14px; }
        
        .btn-main-start { background-color: #0284c7; color: #ffffff; }
        .btn-main-finish { background-color: #f5a623; color: #000000; }
        .btn-main-finish:disabled { background-color: #555; color: #888; cursor: not-allowed; }

        /* 수량 확인 팝업 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-body { background: #1e1e1e; border: 1px solid #00e676; border-radius: 8px; width: 90%; max-width: 360px; padding: 18px; }
        .modal-title { color: #00e676; font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
        
        .info-card { background: #121212; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9em; }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: #888; }
        .info-val { color: #fff; font-weight: bold; }
        .info-val-highlight { color: #38bdf8; font-weight: bold; }

        .modal-input-label { font-size: 0.85em; color: #00e676; margin-bottom: 4px; display: block; text-align: center; }
        .modal-input { width: 100%; padding: 10px; background: #121212; border: 1px solid #00e676; border-radius: 4px; color: #00e676; font-size: 1.5em; text-align: center; font-weight: bold; margin-bottom: 14px; }
        .btn-modal-save { background: #00e676; color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">📱 재고조사 LOT 스캐너</div>

    <!-- 작성자 입력 -->
    <input type="text" id="workerInput" class="form-input" placeholder="작성자 이름 직접 입력">

    <!-- 위치 선택 -->
    <select id="deptSelect" class="form-input"></select>

    <!-- 카메라 영역 -->
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="guide-overlay">
            <div class="guide-text">박스 안에 LOT 번호 맞추기</div>
            <div class="guide-box"></div>
        </div>
    </div>

    <!-- 카메라 제어 (줌 & 후레시) 패널 -->
    <div id="cameraControls" class="camera-controls" style="display:none;">
        <button id="torchBtn" class="btn-torch">🔦 후레시 켜기</button>
        <div class="zoom-area">
            <span>줌:</span>
            <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1">
        </div>
    </div>

    <!-- 스캔 / 인식 버튼 -->
    <button id="ocrBtn" class="btn btn-scan">📷 스캔 / 인식하기</button>
    <div id="statusMsg" class="status-bar">상태 확인 중...</div>

    <!-- LOT 직접 입력 및 추가 -->
    <div class="search-row">
        <input type="text" id="lotInput" class="input-lot" placeholder="LOT 번호 직접 입력">
        <button id="addBtn" class="btn-add">➕ 추가</button>
    </div>

    <!-- 내 폰 임시 저장 현황 헤더 -->
    <div class="local-list-header">
        <span>💾 내 폰에 저장된 목록</span>
        <span class="badge-count" id="localCountBadge">0건</span>
    </div>

    <!-- 내 폰 데이터 테이블 -->
    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th>품명</th>
                    <th>LOT NO</th>
                    <th>수량</th>
                    <th>삭제</th>
                </tr>
            </thead>
            <tbody id="localTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 하단 고정 스티키 메인 버튼 -->
<div class="sticky-footer">
    <button id="mainActionBtn" class="btn btn-main-start">▶ 재고조사 시작 (데이터 로드)</button>
</div>

<!-- 수량 확인 팝업 모달 -->
<div id="qtyModal" class="modal-overlay">
    <div class="modal-body">
        <div class="modal-title">📦 LOT 정보 확인 & 수량 입력</div>
        <div class="info-card">
            <div class="info-row">
                <span class="info-label">LOT NO</span>
                <span id="modalLotNo" class="info-val">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">품명</span>
                <span id="modalItemName" class="info-val-highlight">조회 중...</span>
            </div>
            <div class="info-row">
                <span class="info-label">전산(기본) 수량</span>
                <span id="modalDefaultQty" class="info-val">0 개</span>
            </div>
        </div>
        <label class="modal-input-label">✏️ 실제 실사 수량 입력</label>
        <input type="number" id="realQtyInput" class="modal-input" value="1">
        <button id="saveQtyBtn" class="btn-modal-save">💾 내 폰에 즉시 저장</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, doc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
    } catch(e) {
        console.warn("Firebase 미연결 상태");
    }

    const STORAGE_KEY = "TEMP_INVENTORY_SCAN_LOGS";
    const MASTER_CACHE_KEY = "MASTER_LOT_DATA_CACHE";
    const SAVED_WORKER_KEY = "SAVED_WORKER_NAME";
    const SAVED_DEPT_KEY = "SAVED_DEPT_NAME";
    
    let globalOcrWorker = null;
    let pendingLotNo = "";
    let currentMatchedItem = { itemName: "미등록 품목", defaultQty: 1 };
    let videoTrack = null;
    let isTorchOn = false;

    // 기본 테스트용 목업 데이터 (데이터 미로드 시에도 인식되도록 기본 탑재)
    const mockMasterData = {
        "20260928-001": { itemName: "가공 부품 A타입", defaultQty: 50 },
        "20260928-002": { itemName: "가공 부품 B타입", defaultQty: 100 },
        "1234567890": { itemName: "알루미늄 프레임 100mm", defaultQty: 25 }
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('statusMsg');
    const lotInput = document.getElementById('lotInput');
    const mainActionBtn = document.getElementById('mainActionBtn');
    const workerInput = document.getElementById('workerInput');
    const deptSelect = document.getElementById('deptSelect');

    document.addEventListener("DOMContentLoaded", () => {
        // 작성자 기억 복원
        const savedWorker = localStorage.getItem(SAVED_WORKER_KEY);
        if (savedWorker) workerInput.value = savedWorker;

        workerInput.addEventListener('input', (e) => {
            localStorage.setItem(SAVED_WORKER_KEY, e.target.value.trim());
        });

        populateDeptOptions();
        deptSelect.addEventListener('change', (e) => {
            localStorage.setItem(SAVED_DEPT_KEY, e.target.value);
        });

        // 최초 실행 시 캐시가 없으면 기본 목업 데이터 자동 장착 (미등록 방지)
        if (!localStorage.getItem(MASTER_CACHE_KEY)) {
            localStorage.setItem(MASTER_CACHE_KEY, JSON.stringify(mockMasterData));
        }

        renderLocalList();
        initCamera();
        initBackgroundOCR();
    });

    function populateDeptOptions() {
        const defaultLocations = ["주조", "지재", "생산1F", "검사2F", "영업", "외주"];
        deptSelect.innerHTML = "";
        defaultLocations.forEach(loc => {
            const opt = document.createElement('option');
            opt.value = loc;
            opt.innerText = loc;
            deptSelect.appendChild(opt);
        });

        const savedDept = localStorage.getItem(SAVED_DEPT_KEY);
        if (savedDept && Array.from(deptSelect.options).some(o => o.value === savedDept)) {
            deptSelect.value = savedDept;
        } else {
            deptSelect.value = defaultLocations[0];
            localStorage.setItem(SAVED_DEPT_KEY, defaultLocations[0]);
        }
    }

    // 📷 카메라 및 줌/후레시 초기화
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", advanced: [{ zoom: 1 }] } 
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];

            const capabilities = videoTrack.getCapabilities();
            const controlsDiv = document.getElementById('cameraControls');
            
            // 줌 기능 지원 시 슬라이더 활성화
            if (capabilities.zoom) {
                controlsDiv.style.display = "flex";
                const zoomRange = document.getElementById('zoomRange');
                zoomRange.min = capabilities.zoom.min;
                zoomRange.max = capabilities.zoom.max;
                zoomRange.step = capabilities.zoom.step || 0.1;
                zoomRange.value = videoTrack.getSettings().zoom || capabilities.zoom.min;
                
                zoomRange.oninput = async (e) => {
                    try {
                        await videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] });
                    } catch(err) { console.error(err); }
                };
            }

            // 후레시(토치) 지원 시 버튼 활성화
            if (capabilities.torch) {
                controlsDiv.style.display = "flex";
                const torchBtn = document.getElementById('torchBtn');
                torchBtn.style.display = "block";
                torchBtn.onclick = async () => {
                    isTorchOn = !isTorchOn;
                    try {
                        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                        torchBtn.innerText = isTorchOn ? "🔦 후레시 끄기" : "🔦 후레시 켜기";
                        torchBtn.style.background = isTorchOn ? "#f5a623" : "#333";
                        torchBtn.style.color = isTorchOn ? "#000" : "#fff";
                    } catch(err) { console.error(err); }
                };
            } else {
                document.getElementById('torchBtn').style.display = "none";
            }
        } catch (err) {
            updateStatus("❌ 카메라 접근 권한을 허용해주세요.", false);
        }
    }

    async function initBackgroundOCR() {
        if (typeof Tesseract !== 'undefined') {
            try {
                globalOcrWorker = await Tesseract.createWorker('eng');
                await globalOcrWorker.setParameters({ tessedit_char_whitelist: '0123456789-' });
            } catch(e) { console.error("OCR 초기화 실패", e); }
        }
    }

    async function fetchMasterDataFromServer() {
        if (!db) {
            localStorage.setItem(MASTER_CACHE_KEY, JSON.stringify(mockMasterData));
            return Object.keys(mockMasterData).length;
        }
        try {
            const querySnapshot = await getDocs(collection(db, "master_lots"));
            const masterMap = {};
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                masterMap[doc.id] = {
                    itemName: data.itemName || "품명 미지정",
                    defaultQty: data.defaultQty || 1
                };
            });
            localStorage.setItem(MASTER_CACHE_KEY, JSON.stringify(masterMap));
            return Object.keys(masterMap).length;
        } catch (e) {
            console.error("마스터 데이터 동기화 실패:", e);
            throw e;
        }
    }

    function getMasterCache() {
        const cached = localStorage.getItem(MASTER_CACHE_KEY);
        return cached ? JSON.parse(cached) : mockMasterData;
    }

    function getLocalLogs() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    function saveLocalLogs(logs) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
        renderLocalList();
    }

    function clearAllLocalData() {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(MASTER_CACHE_KEY);
        renderLocalList();
    }

    function updateMainButtonUI() {
        const masterCache = getMasterCache();
        const logs = getLocalLogs();
        const hasActiveData = (masterCache !== null) || (logs.length > 0);

        if (logs.length > 0) {
            mainActionBtn.className = "btn btn-main-finish";
            mainActionBtn.innerHTML = `🏁 마감 및 서버 전송 (${logs.length}건 완료)`;
            updateStatus(`✅ 이어서 재고조사 진행 가능 (${logs.length}건 저장됨)`, true);
        } else {
            mainActionBtn.className = "btn btn-main-start";
            mainActionBtn.innerHTML = "▶ 재고조사 시작 (데이터 로드)";
            updateStatus("▶ 준비 완료. 스캔 또는 '재고조사 시작'을 누르세요.", true);
        }
    }

    function renderLocalList() {
        const logs = getLocalLogs();
        const tbody = document.getElementById('localTableBody');
        document.getElementById('localCountBadge').innerText = `${logs.length}건`;
        updateMainButtonUI();
        tbody.innerHTML = "";

        if (logs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:#666; padding:10px;">저장된 스캔 내역이 없습니다.</td></tr>`;
            return;
        }

        logs.slice().reverse().forEach((item, reverseIdx) => {
            const realIndex = logs.length - 1 - reverseIdx;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color:#38bdf8; text-align:left; font-size:0.78em; padding-left:6px;">${item.item_name}</td>
                <td style="color:#00e676; font-weight:bold;">${item.lot_no}</td>
                <td style="font-weight:bold;">${item.qty}</td>
                <td><button class="btn-del" data-idx="${realIndex}">삭제</button></td>
            `;
            tbody.appendChild(tr);
        });

        document.querySelectorAll('.btn-del').forEach(btn => {
            btn.addEventListener('click', (e) => {
                deleteLocalItem(parseInt(e.target.getAttribute('data-idx'), 10));
            });
        });
    }

    function deleteLocalItem(idx) {
        const logs = getLocalLogs();
        logs.splice(idx, 1);
        saveLocalLogs(logs);
        updateStatus("🗑️ 선택한 항목이 삭제되었습니다.", true);
    }

    // 스캔 버튼
    document.getElementById('ocrBtn').addEventListener('click', async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        updateStatus("🔍 LOT 분석 중...", true);

        let lotNo = await scanBarcode(canvas);
        if (!lotNo) lotNo = await scanFastOCR(canvas);

        if (lotNo) {
            lotInput.value = lotNo;
            openQtyModal(lotNo);
        } else {
            updateStatus("❌ 인식 실패. 위치를 다시 맞춰주세요.", false);
        }
    });

    document.getElementById('addBtn').addEventListener('click', () => {
        const manualLot = lotInput.value.trim();
        if (!manualLot) {
            alert("LOT 번호를 입력해주세요.");
            return;
        }
        openQtyModal(manualLot);
    });

    async function scanBarcode(cvs) {
        try {
            if (typeof ZXing === 'undefined') return null;
            const reader = new ZXing.BrowserMultiFormatReader();
            const res = await reader.decodeFromCanvas(cvs);
            return res ? res.getText().trim() : null;
        } catch (e) { return null; }
    }

    async function scanFastOCR(cvs) {
        try {
            if (!globalOcrWorker) return null;
            const { data: { text } } = await globalOcrWorker.recognize(cvs);
            const match = text.match(/\d{10}-\d{3}/) || text.match(/[0-9-]{8,15}/);
            return match ? match[0].trim() : null;
        } catch (e) { return null; }
    }

    function openQtyModal(lotNo) {
        pendingLotNo = lotNo;
        const masterData = getMasterCache() || mockMasterData;
        
        if (masterData[lotNo]) {
            currentMatchedItem = masterData[lotNo];
        } else {
            currentMatchedItem = { itemName: "미등록 품목 (임시저장 가능)", defaultQty: 1 };
        }

        document.getElementById('modalLotNo').innerText = lotNo;
        document.getElementById('modalItemName').innerText = currentMatchedItem.itemName;
        document.getElementById('modalDefaultQty').innerText = `${currentMatchedItem.defaultQty} 개`;
        
        const qtyInput = document.getElementById('realQtyInput');
        qtyInput.value = currentMatchedItem.defaultQty;

        document.getElementById('qtyModal').style.display = "flex";
        qtyInput.focus();
        qtyInput.select();
    }

    document.getElementById('saveQtyBtn').addEventListener('click', () => {
        const workerName = workerInput.value.trim();
        if (!workerName) {
            alert("작성자 이름을 입력해주세요!");
            return;
        }

        const qty = parseInt(document.getElementById('realQtyInput').value, 10) || 1;
        document.getElementById('qtyModal').style.display = "none";

        const now = new Date();
        const newItem = {
            lot_no: pendingLotNo,
            item_name: currentMatchedItem.itemName,
            qty: qty,
            worker: workerName,
            dept: deptSelect.value,
            scan_time: now.getTime(),
            time_str: now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
            scan_date: now.toLocaleDateString('en-CA')
        };

        const logs = getLocalLogs();
        logs.push(newItem);
        saveLocalLogs(logs);

        lotInput.value = "";
        updateStatus(`✅ 저장 완료: [${currentMatchedItem.itemName}] ${qty}개`, true);
    });

    // 하단 메인 버튼 (시작 / 마감)
    mainActionBtn.addEventListener('click', async () => {
        const logs = getLocalLogs();

        // 저장된 로그가 없으면 서버 데이터 동기화 수행
        if (logs.length === 0) {
            mainActionBtn.disabled = true;
            updateStatus("🔄 최신 재고 마스터 데이터를 다운로드 중입니다...", true);
            try {
                const totalCount = await fetchMasterDataFromServer();
                updateStatus(`✅ 마스터 데이터 (${totalCount}건) 로드 완료!`, true);
                renderLocalList();
            } catch (err) {
                updateStatus("❌ 서버 데이터 로드 실패. 기본 데이터를 사용합니다.", false);
            } finally {
                mainActionBtn.disabled = false;
            }
            return;
        }

        // 마감 및 서버 전송
        if (!confirm(`총 ${logs.length}건의 스캔 결과를 서버로 전송하고 마감하시겠습니까?`)) return;

        if (!db) {
            alert("Firebase 설정이 올바르지 않습니다.");
            return;
        }

        mainActionBtn.disabled = true;
        updateStatus(`⏳ 서버로 일괄 전송 중... (총 ${logs.length}건)`, true);

        try {
            const batch = writeBatch(db);
            logs.forEach(item => {
                batch.set(doc(collection(db, "scan_logs")), item);
            });
            await batch.commit();

            clearAllLocalData();
            updateStatus(`🎉 마감 완료! 전송 및 초기화되었습니다.`, true);
            alert(`🎉 ${logs.length}건 서버 저장 완료!`);
        } catch (err) {
            console.error(err);
            updateStatus("❌ 전송 실패! 네트워크를 확인하세요.", false);
        } finally {
            mainActionBtn.disabled = false;
        }
    });

    function updateStatus(msg, isSuccess = true) {
        statusMsg.innerText = msg;
        statusMsg.style.color = isSuccess ? "#00e676" : "#ff5252";
        statusMsg.style.borderColor = isSuccess ? "#2e4d32" : "#5d2a2a";
    }
</script>
</body>
</html>
