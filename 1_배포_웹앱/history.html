<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:-apple-system,"Malgun Gothic",Arial,sans-serif;background:#111;color:#eee;margin:0;padding:16px;}
h2{font-size:19px;margin:0 0 12px;}
.navbar{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.navbar a{color:#4fc3ff;font-size:13px;text-decoration:none;padding:4px 10px;border:1px solid #2a4a5c;border-radius:12px;white-space:nowrap;}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
select, input[type=text]{padding:8px;background:#1c1c1c;color:#eee;border:1px solid #444;border-radius:8px;}
button{padding:8px 14px;font-size:14px;font-weight:bold;border-radius:8px;border:none;cursor:pointer;}
.btn-export{background:#4fc3ff;color:#111;}
.summary-box{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px;font-size:14px;line-height:1.7;}
.summary-box b{color:#00e676;}
table{width:100%;border-collapse:collapse;font-size:13px;background:#1c1c1c;border-radius:8px;overflow:hidden;}
th, td{padding:8px 10px;border-bottom:1px solid #2a2a2a;text-align:left;white-space:nowrap;}
th{background:#222;color:#aaa;font-size:12px;}
.empty{padding:30px;text-align:center;color:#888;}
.scroll-wrap{overflow-x:auto;}
</style>
</head>
<body>

<h2>📅 재고 이력 조회 (일자별)</h2>

<div class="navbar">
<a href="index.html">📸 스캔</a>
<a href="upload.html">📂 업로드</a>
<a href="scanview.html">🕒 기록조회</a>
<a href="progress.html">📋 진행률</a>
</div>

<div class="toolbar">
<select id="dateSelect"><option value="">실사 날짜 선택...</option></select>
<select id="runSelect"><option value="__all__">🔗 전체 통합(최신값)</option></select>
<select id="deptSelect"><option value="">전체 부서</option></select>
<input type="text" id="qItem" placeholder="LOT/품번/품명 검색" style="width:160px;">
<button class="btn-export" id="exportBtn">📥 엑셀 다운로드</button>
</div>

<div id="summaryBox" class="summary-box">불러오는 중...</div>
<div id="content"><div class="empty">날짜를 선택해주세요.</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAGIPNxEoMs9yYuQV8gP2PG09bb_F23DrQ",
    authDomain: "lot-bar.firebaseapp.com",
    projectId: "lot-bar",
    storageBucket: "lot-bar.firebasestorage.app",
    messagingSenderId: "905334285763",
    appId: "1:905334285763:web:53569a62031006a611c976"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const STOCK_COL = "lot_stock";

const dateSelect = document.getElementById("dateSelect");
const runSelect = document.getElementById("runSelect");
const deptSelect = document.getElementById("deptSelect");
const qItem = document.getElementById("qItem");
const exportBtn = document.getElementById("exportBtn");
const summaryBox = document.getElementById("summaryBox");
const content = document.getElementById("content");

let allRowsForDate = [];   // 선택한 날짜의 모든 실행(run) 원본 데이터
let currentRows = [];      // 화면에 표시 중인 데이터 (회차 필터 적용 후)

function esc(s){
    if (s === null || s === undefined) return '';
    return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 성능 개선: 부서는 고정된 값들이라 전체 스캔 결과에서 굳이 다시 뽑아낼 필요 없음
const DEPARTMENTS = ["1F(가공생산)", "2F(검사/포장)", "미분류", "영업", "외주", "자재", "주조"];

function daysAgoKST(days){
    const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit" });
    return fmt.format(new Date(Date.now() - days * 24 * 60 * 60 * 1000));
}

function friendlyErrorMessage(e){
    const msg = ((e && e.code) || (e && e.message) || '').toString().toLowerCase();
    if (msg.includes('resource-exhausted') || msg.includes('quota') || msg.includes('429')){
        return '❗ 오늘 조회 한도 초과 - 잠시 후(리셋 후) 다시 시도해주세요.';
    }
    return '❌ 불러오기 실패 (콘솔 확인 필요)';
}

// 존재하는 실사 날짜 목록을 스캔해서 드롭다운 채우기
// 성능 개선: 전체 기간 대신 최근 30일치만 조회 (컬렉션이 계속 커지고 있어 전체 스캔은 읽기 한도를 통째로 소모할 위험이 큼)
async function loadDateAndDeptOptions(){
    try {
        const cutoff = daysAgoKST(30);
        const snap = await getDocs(query(collection(db, STOCK_COL), where('upload_date','>=',cutoff)));
        const dateLots = {};   // 날짜 -> 해당 날짜에 한 번이라도 관측된 lot_no Set (회차와 무관한 고유 건수)
        snap.forEach(d => {
            const r = d.data();
            if (r.upload_date){
                if (!dateLots[r.upload_date]) dateLots[r.upload_date] = new Set();
                dateLots[r.upload_date].add(r.lot_no);
            }
        });

        const sortedDates = Object.keys(dateLots).sort().reverse();
        sortedDates.forEach(dt => {
            const opt = document.createElement("option");
            opt.value = dt;
            opt.textContent = `${dt} (${dateLots[dt].size}건)`;
            dateSelect.appendChild(opt);
        });

        DEPARTMENTS.forEach(d => {
            const opt = document.createElement("option");
            opt.value = d; opt.textContent = d;
            deptSelect.appendChild(opt);
        });

        if (sortedDates.length){
            dateSelect.value = sortedDates[0];
            await loadDate(sortedDates[0]);
        } else {
            summaryBox.textContent = "최근 30일 내 저장된 재고실사 이력이 없습니다.";
            content.innerHTML = '<div class="empty">아직 데이터가 없습니다.</div>';
        }
    } catch(e){
        console.error(e);
        summaryBox.textContent = friendlyErrorMessage(e);
        content.innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
    }
}

async function loadDate(uploadDate){
    if (!uploadDate){
        allRowsForDate = [];
        currentRows = [];
        runSelect.innerHTML = '<option value="__all__">🔗 전체 통합(최신값)</option>';
        summaryBox.textContent = "실사 날짜를 선택해주세요.";
        content.innerHTML = '<div class="empty">날짜를 선택해주세요.</div>';
        return;
    }
    summaryBox.textContent = "불러오는 중...";
    try {
        const snap = await getDocs(query(collection(db, STOCK_COL), where('upload_date','==',uploadDate)));
        allRowsForDate = [];
        snap.forEach(d => allRowsForDate.push(d.data()));
        populateRunOptions();
        applyRunFilter();
    } catch(e){
        console.error(e);
        summaryBox.textContent = friendlyErrorMessage(e);
        content.innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
    }
}

function runKeyOf(r){
    return r.run_at || r.uploaded_at || '';
}

// 선택한 날짜에 실제로 실행된 시각(회차) 목록을 드롭다운에 채움
function populateRunOptions(){
    runSelect.innerHTML = '<option value="__all__">🔗 전체 통합(최신값)</option>';
    const runCounts = {};
    allRowsForDate.forEach(r => {
        const key = runKeyOf(r);
        if (!key) return;
        runCounts[key] = (runCounts[key] || 0) + 1;
    });
    Object.keys(runCounts).sort().forEach(run => {
        const opt = document.createElement("option");
        opt.value = run;
        const timeLabel = run.length >= 16 ? run.slice(11,16) : run;
        opt.textContent = `${timeLabel} 실행 (${runCounts[run]}건)`;
        runSelect.appendChild(opt);
    });
    runSelect.value = '__all__';
}

// 회차 선택에 따라 currentRows를 구성
// "__all__" : 같은 날 여러 번 실행됐어도 LOT별로 가장 최근 실행값 하나만 채택 (놓친 LOT 없이 통합)
// 특정 회차  : 그 시각에 찍힌 스냅샷 그대로 표시
function applyRunFilter(){
    const sel = runSelect.value || '__all__';
    if (sel === '__all__'){
        const latestByLot = {};
        allRowsForDate.forEach(r => {
            const key = r.lot_no;
            const existing = latestByLot[key];
            if (!existing || runKeyOf(r) > runKeyOf(existing)) latestByLot[key] = r;
        });
        currentRows = Object.values(latestByLot);
    } else {
        currentRows = allRowsForDate.filter(r => runKeyOf(r) === sel);
    }
    render();
}

function getFiltered(){
    const dept = deptSelect.value;
    const q = qItem.value.trim().toLowerCase();
    return currentRows.filter(r => {
        if (dept && r.department !== dept) return false;
        if (q){
            const hay = `${r.lot_no||''} ${r.item_no||''} ${r.item_name||''}`.toLowerCase();
            if (hay.indexOf(q) === -1) return false;
        }
        return true;
    });
}

function render(){
    const rows = getFiltered();

    const deptBreakdown = {};
    rows.forEach(r => {
        const dep = r.department || '미분류';
        deptBreakdown[dep] = (deptBreakdown[dep] || 0) + 1;
    });
    const uploadedAt = rows.length ? rows[0].uploaded_at : null;

    const runLabel = (runSelect.value && runSelect.value !== '__all__')
        ? `${esc(runSelect.value)} 회차`
        : '전체 통합(LOT별 최신값)';
    let sHtml = `실사 날짜: <b>${esc(dateSelect.value)}</b> · 보기: <b>${runLabel}</b> · 표시 중: <b>${rows.length}</b>건`;
    if (uploadedAt) sHtml += ` · 업로드 시각: <b>${esc(uploadedAt)}</b>`;
    if (Object.keys(deptBreakdown).length){
        sHtml += '<br>부서별: ' + Object.keys(deptBreakdown).sort().map(d => `${esc(d)} <b>${deptBreakdown[d]}</b>건`).join('&nbsp;&nbsp;');
    }
    summaryBox.innerHTML = sHtml;

    if (!rows.length){
        content.innerHTML = '<div class="empty">조건에 맞는 데이터가 없습니다.</div>';
        return;
    }

    let html = '<div class="scroll-wrap"><table><thead><tr><th>#</th><th>LOT NO</th><th>부서</th><th>품번</th><th>품명</th><th>수량</th><th>단위</th><th>창고</th></tr></thead><tbody>';
    rows.forEach((r,i) => {
        html += `<tr>
            <td>${i+1}</td>
            <td>${esc(r.lot_no)}</td>
            <td>${esc(r.department||'-')}${r.subcontract_type?' ('+esc(r.subcontract_type)+')':''}</td>
            <td>${esc(r.item_no)}</td>
            <td>${esc(r.item_name)}</td>
            <td>${esc(r.qty)}</td>
            <td>${esc(r.unit)}</td>
            <td>${esc(r.warehouse||'-')}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    content.innerHTML = html;
}

exportBtn.onclick = () => {
    const rows = getFiltered();
    if (!rows.length) return;
    const header = ['#','LOT NO','부서','외주구분','품번','품명','수량','단위','창고','업로드시각'];
    const aoa = [header];
    rows.forEach((r,i) => {
        aoa.push([i+1, r.lot_no, r.department||'', r.subcontract_type||'', r.item_no, r.item_name, r.qty, r.unit, r.warehouse||'', r.uploaded_at||'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, dateSelect.value || 'history');
    XLSX.writeFile(wb, `재고이력_${dateSelect.value || 'unknown'}.xlsx`);
};

dateSelect.addEventListener("change", () => loadDate(dateSelect.value));
runSelect.addEventListener("change", applyRunFilter);
deptSelect.addEventListener("change", render);
qItem.addEventListener("input", render);

loadDateAndDeptOptions();

// 성능 개선: 유휴 5분이면 자동으로 스캔 화면으로 이동
let idleTimer = null;
function resetIdleTimer(){
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { location.href = "index.html"; }, 5 * 60 * 1000);
}
['click','touchstart','keydown'].forEach(evt => document.addEventListener(evt, resetIdleTimer));
resetIdleTimer();
</script>

</body>
</html>
