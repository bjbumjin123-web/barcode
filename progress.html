<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실사 진행률</title>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:-apple-system,"Malgun Gothic",Arial,sans-serif;background:#111;color:#eee;margin:0;padding:16px;}
h2{font-size:16px;text-align:center;margin:0 0 12px;white-space:nowrap;}
.navbar{display:flex;justify-content:center;gap:4px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;}
.navbar a{color:#4fc3ff;font-size:12px;letter-spacing:-0.3px;text-decoration:none;padding:5px 6px;border:1px solid #2a4a5c;border-radius:10px;white-space:nowrap;}
.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
input[type=date], select{padding:6px;background:#1c1c1c;color:#eee;border:1px solid #444;border-radius:6px;font-size:12px;letter-spacing:-0.3px;white-space:nowrap;flex:0 0 auto;}
button{padding:6px 10px;font-size:12px;letter-spacing:-0.3px;font-weight:bold;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;flex:0 0 auto;}
.btn-export{background:#4fc3ff;color:#111;}
.live-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#00e676;margin-left:6px;vertical-align:middle;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#00e676;animation:pulse 1.5s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}}
.progress-box{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px;}
.progress-numbers{font-size:15px;margin-bottom:10px;white-space:nowrap;}
.progress-numbers b{color:#00e676;}
.progress-bar-bg{width:100%;height:18px;background:#2a2a2a;border-radius:10px;overflow:hidden;}
.progress-bar-fill{height:100%;background:#00e676;transition:width 0.3s;}
.percent-label{text-align:right;font-size:13px;color:#4fc3ff;margin-top:6px;white-space:nowrap;}
table{width:100%;border-collapse:collapse;font-size:13px;background:#1c1c1c;border-radius:8px;overflow:hidden;}
th, td{padding:8px 10px;border-bottom:1px solid #2a2a2a;text-align:left;white-space:nowrap;}
th{background:#222;color:#aaa;font-size:12px;}
.empty{padding:30px;text-align:center;color:#888;white-space:nowrap;}
.scroll-wrap{overflow-x:auto;}
.master-note{font-size:12px;color:#888;margin-top:8px;white-space:nowrap;}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;}
.tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:bold;color:#aaa;background:#1c1c1c;border:1px solid #333;cursor:pointer;white-space:nowrap;flex:0 0 auto;}
.tab.active{color:#111;background:#00e676;border-color:#00e676;}
.diff-bad{color:#ff8a8a;font-weight:bold;}
.diff-ok{color:#00e676;}
</style>
</head>
<body>

<h2>📋 실사 진행률</h2>

<div class="navbar"></div>

<div class="toolbar">
<input type="date" id="dateInput">
<select id="deptSelect"><option value="">전체 부서</option></select>
<button class="btn-export" id="refreshBtn">🔄 새로고침</button>
<button class="btn-export" id="exportBtn">📥 다운로드</button>
</div>

<div id="content"><div class="empty">불러오는 중...</div></div>

<script type="module">
import { sb, wrap, fetchAll, renderNavbar } from "./common.js?v=1";
renderNavbar("progress");


// 하루(1회) 기준: 한국시간 07:00 ~ 다음날 06:59 를 한 회로 봄 -> 07:00 이전이면 전날 날짜를 '회차 날짜'로 사용
const ROUND_START_HOUR = 7;
function roundDateKST(){
    const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit" });
    return fmt.format(new Date(Date.now() - ROUND_START_HOUR * 3600 * 1000));
}

const STOCK_COL = "stock";
const LOG_COL = "scan_log";

const dateInput = document.getElementById("dateInput");
const deptSelect = document.getElementById("deptSelect");
const content = document.getElementById("content");

let currentView = 'unchecked';
let masterDate = null;
let masterRows = [];       
let dateLogs = [];         

dateInput.value = roundDateKST();

const statusText = r => { const a = (r.lot_status||'').toString().trim(), b = (r.lot_substatus||'').toString().trim(); return a ? (b && b !== a ? a + ' / ' + b : a) : (b || '-'); };
function esc(s){
    if (s === null || s === undefined) return '';
    return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 성능 개선: 부서는 lot_daily_snapshot.py의 classify_department()가 만드는 고정된 값들이라
// 매번 전체 컬렉션을 긁어서 알아낼 필요 없이 목록을 그대로 씀
const DEPARTMENTS = ["1F(가공생산)", "2F(검사/포장)", "미분류", "영업", "외주", "자재", "주조"];
function loadDepartments(){
    DEPARTMENTS.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = d;
        deptSelect.appendChild(opt);
    });
}

function friendlyErrorMessage(e){
    const msg = ((e && e.code) || (e && e.message) || '').toString().toLowerCase();
    if (msg.includes('resource-exhausted') || msg.includes('quota') || msg.includes('429')){
        return '❗ 오늘 조회 한도 초과 - 잠시 후(리셋 후) 다시 시도해주세요.';
    }
    return '❌ 불러오기 실패 (콘솔 확인 필요)';
}

async function findMasterDate(){
    const { data: top, error: topErr } = await sb.from(STOCK_COL).select('upload_date').order('upload_date', { ascending:false }).limit(1);
    if (topErr) throw topErr;
    const snap = top.map(wrap);
    let d = null;
    snap.forEach(doc => { d = doc.data().upload_date; });
    return d;
}

async function loadData(){
    content.innerHTML = '<div class="empty">불러오는 중...</div>';

    let masterDateResult;
    try {
        masterDateResult = await findMasterDate();
    } catch(e){
        console.error(e);
        content.innerHTML = `<div class="empty">${friendlyErrorMessage(e)}</div>`;
        return;
    }
    masterDate = masterDateResult;

    if (!masterDate){
        content.innerHTML = '<div class="empty">아직 업로드된 재고 데이터가 없습니다.</div>';
        return;
    }

    try {
        // 하루에 여러 번 실행된 스냅샷이 섞여 있을 수 있으므로 LOT별 최신 실행값만 채택
        const stockSnap = await fetchAll(() => sb.from(STOCK_COL).select('*').eq('upload_date', masterDate));
        const latestByLot = {};
        stockSnap.forEach(d => {
            const r = d.data();
            const key = r.lot_no;
            const runAt = r.run_at || r.uploaded_at || '';
            const existing = latestByLot[key];
            if (!existing || runAt > (existing.run_at || existing.uploaded_at || '')) {
                latestByLot[key] = r;
            }
        });
        masterRows = Object.values(latestByLot);
        // 최근 실행분에 있는 LOT만 기준으로 삼음 (그 사이 출고된 LOT이 미확인에 끼지 않도록)
        let maxRun = '';
        masterRows.forEach(r => { const k = r.run_at || r.uploaded_at || ''; if (k > maxRun) maxRun = k; });
        if (maxRun) masterRows = masterRows.filter(r => (r.run_at || r.uploaded_at || '') === maxRun);
        // 실사불가 상태(CHK_TYPE) LOT 은 실사 대상에서 제외 (스캔 화면의 진행바/마감 대상과 동일 기준)
        masterRows = masterRows.filter(r => r.chk_type !== '실사불가 상태');

        const logSnap = await fetchAll(() => sb.from(LOG_COL).select('*').eq('scan_date', dateInput.value));
        dateLogs = [];
        // 수량 입력까지 끝낸 스캔만 '확인'으로 인정
        logSnap.forEach(d => { const r = d.data(); if (r.actual_qty !== null && r.actual_qty !== undefined) dateLogs.push(r); });

        render();
    } catch(e){
        console.error(e);
        content.innerHTML = `<div class="empty">${friendlyErrorMessage(e)}</div>`;
    }
}

// 성능 개선: 화면을 켜둔 채 방치해도(아무 조작 없이 5분) 계속 조회가 나가지 않도록,
// 유휴 5분이면 자동으로 스캔 화면으로 이동시킴
let idleTimer = null;
function resetIdleTimer(){
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { location.href = "index.html"; }, 5 * 60 * 1000);
}
['click','touchstart','keydown'].forEach(evt => document.addEventListener(evt, resetIdleTimer));
resetIdleTimer();

function render(){
    const dept = deptSelect.value;
    const filteredMaster = masterRows.filter(r => !dept || r.department === dept);

    const scannedLotSet = {};
    dateLogs.forEach(r => { scannedLotSet[r.lot_no] = true; });

    const unchecked = filteredMaster.filter(r => !scannedLotSet[r.lot_no]);

    const latestByLot = {};
    dateLogs.forEach(r => {
        if (!latestByLot[r.lot_no] || r.scanned_at > latestByLot[r.lot_no].scanned_at) latestByLot[r.lot_no] = r;
    });

    const checkedList = [];
    filteredMaster.forEach(r => {
        const latest = latestByLot[r.lot_no];
        if (latest){
            checkedList.push({
                lot_no:r.lot_no, item_no:r.item_no, item_name:r.item_name, lot_status:r.lot_status, lot_substatus:r.lot_substatus, qty:r.qty, unit:r.unit,
                warehouse:r.warehouse, department:r.department, subcontract_type:r.subcontract_type,
                scanned_at: latest.scanned_at, scanned_by: latest.scanned_by, scan_dept: latest.scan_dept,
                actual_qty: latest.actual_qty, diff: latest.diff
            });
        }
    });
    checkedList.sort((a,b) => (a.scanned_at < b.scanned_at ? 1 : -1));

    const total = filteredMaster.length;
    const checked = total - unchecked.length;
    const percent = total > 0 ? Math.round(checked / total * 100) : 0;

    let html = `
    <div class="progress-box">
        <div class="progress-numbers">확인 완료: <b>${checked}</b> / ${total}건</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%;"></div></div>
        <div class="percent-label">${percent}%</div>
        <div class="master-note">기준 데이터: ${esc(masterDate)} 업로드분 / 확인: ${esc(dateInput.value)} 수량 입력 기준</div>
    </div>
    <div class="tabs">
        <div class="tab ${currentView==='unchecked'?'active':''}" data-view="unchecked">🔲 미확인 (${unchecked.length})</div>
        <div class="tab ${currentView==='checked'?'active':''}" data-view="checked">✅ 확인됨 (${checkedList.length})</div>
    </div>
    `;

    if (currentView === 'unchecked'){
        if (!unchecked.length){
            html += '<div class="empty">🎉 이 날짜 기준으로 모든 LOT 확인이 완료됐습니다.</div>';
        } else {
            html += '<div class="scroll-wrap"><table><thead><tr><th>#</th><th>LOT NO</th><th>부서</th><th>품번</th><th>품명</th><th>LOT상태</th><th>수량</th><th>창고</th></tr></thead><tbody>';
            unchecked.forEach((r,i) => {
                html += `<tr><td>${i+1}</td><td>${esc(r.lot_no)}</td><td>${esc(r.department||'-')}${r.subcontract_type?' ('+esc(r.subcontract_type)+')':''}</td><td>${esc(r.item_no)}</td><td>${esc(r.item_name)}</td><td>${esc(statusText(r))}</td><td>${esc(r.qty)} ${esc(r.unit)}</td><td>${esc(r.warehouse||'-')}</td></tr>`;
            });
            html += '</tbody></table></div>';
        }
    } else {
        if (!checkedList.length){
            html += '<div class="empty">이 날짜에 확인된 LOT이 아직 없습니다.</div>';
        } else {
            html += '<div class="scroll-wrap"><table><thead><tr><th>#</th><th>확인시각</th><th>확인자</th><th>확인부서</th><th>LOT NO</th><th>부서</th><th>품번</th><th>품명</th><th>LOT상태</th><th>시스템수량</th><th>실제수량</th><th>차이</th><th>창고</th></tr></thead><tbody>';
            checkedList.forEach((r,i) => {
                const mismatch = r.diff !== null && r.diff !== 0;
                const deptMismatch = r.scan_dept && r.department && r.scan_dept !== r.department;
                const diffText = r.diff !== null && r.diff !== undefined ? (r.diff > 0 ? '+'+r.diff : r.diff) : '-';
                const diffClass = mismatch ? 'diff-bad' : (r.diff === 0 ? 'diff-ok' : '');
                html += `<tr>
                    <td>${i+1}</td>
                    <td>${esc((r.scanned_at||'').toString().slice(11,19))}</td>
                    <td>${esc(r.scanned_by||'-')}</td>
                    <td class="${deptMismatch?'diff-bad':''}">${esc(r.scan_dept||'-')}</td>
                    <td>${esc(r.lot_no)}</td>
                    <td>${esc(r.department||'-')}${r.subcontract_type?' ('+esc(r.subcontract_type)+')':''}</td>
                    <td>${esc(r.item_no)}</td>
                    <td>${esc(r.item_name)}</td>
                    <td>${esc(statusText(r))}</td>
                    <td>${r.qty !== null ? esc(r.qty)+' '+esc(r.unit) : '-'}</td>
                    <td>${r.actual_qty !== null && r.actual_qty !== undefined ? esc(r.actual_qty) : '-'}</td>
                    <td class="${diffClass}">${diffText}</td>
                    <td>${esc(r.warehouse||'-')}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
        }
    }

    content.innerHTML = html;

    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => { currentView = t.dataset.view; render(); };
    });
}

function buildExportRows(){
    const dept = deptSelect.value;
    const filteredMaster = masterRows.filter(r => !dept || r.department === dept);

    const latestByLot = {};
    dateLogs.forEach(r => {
        if (!latestByLot[r.lot_no] || r.scanned_at > latestByLot[r.lot_no].scanned_at) latestByLot[r.lot_no] = r;
    });

    const rows = [['#','확인여부','LOT NO','부서','외주구분','품번','품명','LOT상태','시스템수량','단위','창고','확인시각','확인자','확인부서','실제수량','차이']];

    filteredMaster.forEach((r, i) => {
        const latest = latestByLot[r.lot_no];
        rows.push([
            i + 1,
            latest ? '확인완료' : '미확인',
            r.lot_no, r.department || '', r.subcontract_type || '',
            r.item_no, r.item_name, statusText(r), r.qty, r.unit, r.warehouse || '',
            latest ? latest.scanned_at : '',
            latest ? latest.scanned_by : '',
            latest ? latest.scan_dept : '',
            latest && latest.actual_qty !== null && latest.actual_qty !== undefined ? latest.actual_qty : '',
            latest && latest.diff !== null && latest.diff !== undefined ? latest.diff : ''
        ]);
    });

    return rows;
}

document.getElementById("exportBtn").onclick = () => {
    const rows = buildExportRows();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, dateInput.value);
    XLSX.writeFile(wb, `실사진행률_${dateInput.value}.xlsx`);
};

document.getElementById("refreshBtn").onclick = loadData;
dateInput.addEventListener("change", loadData);
deptSelect.addEventListener("change", render);

loadDepartments();
loadData();

let userPickedDate = false;
dateInput.addEventListener("change", () => { userPickedDate = true; });

setInterval(() => {
    if (userPickedDate) return;
    const todayNow = roundDateKST();
    if (dateInput.value !== todayNow){
        dateInput.value = todayNow;
        loadData();
    }
}, 60000);
</script>

</body>
</html>
