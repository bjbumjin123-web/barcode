// Firestore 스냅샷처럼 d.data() 로 읽을 수 있게 감싸는 도우미 (기존 코드 호환용)
const wrap = r => ({ id: r.id, data: () => r });

// Supabase는 한 번에 1000행까지만 주므로 나눠서 전부 가져옴
async function fetchAll(build){
    const out = [];
    for (let from = 0; ; from += 1000){
        const { data, error } = await build().order('id').range(from, from + 999);
        if (error) throw error;
        data.forEach(r => out.push(wrap(r)));
        if (data.length < 1000) break;
    }
    return out;
}


function todayKST(){
    const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit" });
    return fmt.format(new Date());
}

const STOCK_COL = "stock";

function nowDateTimeStr(){
    const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    });
    const map = {};
    fmt.formatToParts(new Date()).forEach(p => map[p.type] = p.value);
    return `${map.year}-${map.month}-${map.day} ${map.hour}:${map.minute}:${map.second}`;
}

function classifyDepartment(ref, warehouse){
    ref = ref || ''; warehouse = warehouse || '';
    const isCheongwoo = ref.indexOf('청우') !== -1;

    if (warehouse === '원자재창고') return { department:'자재', subcontractType:null };
    if (warehouse === '완제품창고') return { department:'영업', subcontractType:null };
    if (warehouse === '외주창고') return { department:'외주', subcontractType:null };

    if (ref.indexOf('2F') !== -1) return { department:'2F(검사/포장)', subcontractType:null };
    if (ref.indexOf('주조') !== -1 || ref.indexOf('사상') !== -1) return { department:'주조', subcontractType:null };
    if (ref.indexOf('1F') !== -1) return { department:'1F(가공생산)', subcontractType: isCheongwoo ? '청우' : '자체' };
    if (warehouse.indexOf('반제품') !== -1) return { department:'1F(가공생산)', subcontractType: isCheongwoo ? '청우' : '자체' };

    return { department:'미분류', subcontractType:null };
}

async function loadSummary(){
    try{
        // 전체 재고를 읽지 않고, 날짜별 집계 뷰(stock_dates)만 조회
        const { data: dates, error } = await sb.from('stock_dates').select('*').order('upload_date', { ascending:false });

        const total = dates.reduce((s, r) => s + Number(r.n), 0);
        const lastAt = dates.reduce((m, r) => ((r.last_at || '') > m ? r.last_at : m), '');
        const maxDate = dates.length ? dates[0].upload_date : null;

        const deptBreakdown = {};
        if (maxDate){
            const rows = await fetchAll(() => sb.from(STOCK_COL).select('department').eq('upload_date', maxDate));
            rows.forEach(d => {
                const dep = d.data().department || '미분류';
                deptBreakdown[dep] = (deptBreakdown[dep] || 0) + 1;
            });
        }

        let html = `누적 저장된 LOT 기록: <b>${total}</b>건<br>실사 날짜 종류: <b>${dates.length}</b>개<br>마지막 업로드: <b>${lastAt || '없음'}</b>`;
        if (maxDate){
            html += `<br><br>최신 실사(${maxDate}) 부서별 분포:<br>`;
            html += Object.keys(deptBreakdown).map(d => `${d}: <b>${deptBreakdown[d]}</b>건`).join('&nbsp;&nbsp;');
        }
        summaryBox.innerHTML = html;
    }catch(e){
        console.error(e);
        summaryBox.textContent = '요약 정보를 불러오지 못했습니다.';
    }
}

    }
}

// 엑셀 날짜(숫자/문자/Date) -> 'YYYY-MM-DD', 못 읽으면 fallback
function normalizeDate(v, fallback){
    if (v === null || v === undefined || v === '') return fallback;
    if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
    if (typeof v === 'number'){
        if (v > 20000 && v < 80000){                       // 엑셀 날짜 일련번호
            return new Date(Math.round((v - 25569) * 86400 * 1000)).toISOString().slice(0, 10);
        }
        v = String(Math.trunc(v));
    }
    const digits = String(v).replace(/[^0-9]/g, '');
    if (digits.length >= 8){
        const y = digits.slice(0,4), m = digits.slice(4,6), d = digits.slice(6,8);
        if (+m >= 1 && +m <= 12 && +d >= 1 && +d <= 31) return `${y}-${m}-${d}`;
    }
    const m2 = String(v).trim().match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
    if (m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
    return fallback;
}

function parseLotExcel(file, defaultDate){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            try{
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
                if (rows.length < 2){ reject('❌ 엑셀에 데이터가 없습니다. (양식의 2행부터 입력하세요)'); return; }

                const header = rows[0].map(h => (h || '').toString().trim());
                let lotIdx = header.indexOf('LOT NO'); if (lotIdx === -1) lotIdx = header.indexOf('LOT');
                const idx = { lot_no: lotIdx, item_no: header.indexOf('품번'), item_name: header.indexOf('품명') };
                const dateIdx = header.indexOf('날짜');
                const missing = Object.keys(idx).filter(k => idx[k] === -1);
                if (missing.length){
                    const names = { lot_no:'LOT NO', item_no:'품번', item_name:'품명' };
                    reject('❌ 엑셀에서 다음 컬럼을 찾을 수 없습니다: ' + missing.map(k => names[k]).join(', ') + ' (양식 다운로드를 이용하세요)');
                    return;
                }
                const parsed = [];
                for (let i = 1; i < rows.length; i++){
                    const row = rows[i];
                    const lotNo = (row[idx.lot_no] || '').toString().trim();
                    if (!lotNo || lotNo === 'LOT NO') continue;
                    const rawDate = dateIdx !== -1 ? row[dateIdx] : '';
                    parsed.push({
                        lot_no: lotNo,
                        item_no: (row[idx.item_no] || '').toString().trim(),
                        item_name: (row[idx.item_name] || '').toString().trim(),
                        work_date: normalizeDate(rawDate, defaultDate),
                        date_ok: rawDate === '' || rawDate === null || rawDate === undefined || normalizeDate(rawDate, '') !== ''
                    });
                }
                resolve(parsed);
            }catch(err){
                reject('❌ 엑셀 파일을 읽을 수 없습니다: ' + err.message);
            }
        };
        reader.onerror = () => reject('❌ 파일을 읽는 중 오류가 발생했습니다.');
        reader.readAsArrayBuffer(file);
    });
}

async function uploadLotMaster(type, rows){
    const info = TYPE_INFO[type];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateInput.value)) return { success:false, message:'❌ 기본 날짜 형식이 올바르지 않습니다.' };
    if (!rows || !rows.length) return { success:false, message:'❌ 엑셀에 데이터가 없습니다.' };

    const byLot = {}, dupCount = {};
    const noItem = [], badFormat = [], badDate = [];
    const lotFormatRe = /^\d{10}-\d{3}$/;
    rows.forEach(r => {
        dupCount[r.lot_no] = (dupCount[r.lot_no] || 0) + 1;
        if (!r.item_no && !r.item_name){ noItem.push(r.lot_no); return; }      // 품번/품명 둘 다 없으면 조회에 쓸모없어 제외
        if (!lotFormatRe.test(r.lot_no)) badFormat.push(r.lot_no);
        if (!r.date_ok) badDate.push(r.lot_no);
        const old = byLot[r.lot_no];
        if (!old || r.work_date >= old.work_date){                               // 같은 LOT은 최근 날짜 한 줄
            byLot[r.lot_no] = { lot_no: r.lot_no, item_no: r.item_no, item_name: r.item_name, work_date: r.work_date, source: info.source };
        }
    });
    const savedRows = Object.values(byLot);
    if (!savedRows.length) return { success:false, message:'❌ 저장할 행이 없습니다. (품번/품명이 모두 비어 있음)' };

    const dupLots = Object.keys(dupCount).filter(k => dupCount[k] > 1);
    const dupWarning = dupLots.length ? '⚠️ 엑셀 안에 중복된 LOT: ' + dupLots.slice(0,15).map(l => `${l} (${dupCount[l]}회)`).join(', ') + ' — 가장 최근 날짜 행으로 저장됩니다.' : '';
    const warnings = [];
    if (noItem.length) warnings.push(`⚠️ 품번/품명이 모두 빈 LOT ${noItem.length}건은 제외됨: ` + noItem.slice(0,15).join(', '));
    if (badFormat.length) warnings.push(`⚠️ LOT 형식 이상 (${badFormat.length}건, 저장은 됨): ` + badFormat.slice(0,15).join(', '));
    if (badDate.length) warnings.push(`⚠️ 날짜를 읽지 못해 기본 날짜로 저장 (${badDate.length}건): ` + badDate.slice(0,15).join(', '));

    for (let i = 0; i < savedRows.length; i += 500){
        const { error } = await sb.from(LOT_TABLE).upsert(savedRows.slice(i, i + 500), { onConflict: 'lot_no' });
        if (error) throw error;
    }
    return { success:true, message:`✅ ${info.label} 업로드 완료: ${savedRows.length}건 반영됨 (같은 LOT은 덮어쓰기, 더 오래된 날짜는 무시)`,
             dup_warning: dupWarning, validation_warnings: warnings, saved_rows: savedRows };
}

templateBtn.onclick = () => {

        ['2) LOT NO 형식 예: 1234567890-001 (품번/품명 둘 다 비어 있는 행은 저장되지 않습니다)'],
        ['3) 날짜 형식 예: 2026-09-30 또는 20260930 (비워 두면 업로드 화면의 기본 날짜로 저장)'],
        ['4) 같은 LOT을 다시 올리면 덮어쓰며, 저장된 지 60일이 지나면 자동 삭제됩니다.']
    ]);
    guide['!cols'] = [{ wch: 80 }];
    XLSX.utils.book_append_sheet(wb, guide, '안내');
    XLSX.writeFile(wb, `LOT양식_${label}.xlsx`);
};

function parseExcelFile(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            try{
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, { type: 'array' });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });

                if (rows.length < 2){ reject('❌ 엑셀에 데이터가 없습니다.'); return; }

                const header = rows[0].map(h => (h || '').toString().trim());
                const colIndex = {
                    lot_no: header.indexOf('LOT NO'),
                    item_no: header.indexOf('품번'),
                    item_name: header.indexOf('품명'),
                    qty: header.indexOf('현 재고'),
                    unit: header.indexOf('단위'),
                    warehouse: header.indexOf('창고'),
                };
                const refIdx = header.indexOf('참조');

                const missing = Object.keys(colIndex).filter(k => colIndex[k] === -1);
                if (missing.length){
                    reject('❌ 엑셀에서 다음 컬럼을 찾을 수 없습니다: ' + missing.join(', '));
                    return;
                }

                const parsed = [];
                for (let i = 1; i < rows.length; i++){
                    const row = rows[i];
                    const lotNo = (row[colIndex.lot_no] || '').toString().trim();
                    if (!lotNo || lotNo === 'LOT NO') continue;

                    parsed.push({
                        lot_no: lotNo,
                        item_no: (row[colIndex.item_no] || '').toString().trim(),
                        item_name: (row[colIndex.item_name] || '').toString().trim(),
                        qty: row[colIndex.qty],
                        unit: (row[colIndex.unit] || '').toString().trim(),
                        warehouse: (row[colIndex.warehouse] || '').toString().trim(),
                        ref: refIdx !== -1 ? (row[refIdx] || '').toString().trim() : '',
                    });
                }
                resolve(parsed);
            }catch(err){
                reject('❌ 엑셀 파일을 읽을 수 없습니다: ' + err.message);
            }
        };
        reader.onerror = () => reject('❌ 파일을 읽는 중 오류가 발생했습니다.');
        reader.readAsArrayBuffer(file);
    });
}

async function uploadMaster(uploadDate, rows){

    if (!/^\d{4}-\d{2}-\d{2}$/.test(uploadDate)){
        return { success:false, message:'❌ 실사 날짜 형식이 올바르지 않습니다.' };
    }
    if (!rows || !rows.length){
        return { success:false, message:'❌ 엑셀에 데이터가 없습니다.' };
    }

    const lotSeen = {};
    rows.forEach(r => {
        const lotNo = (r.lot_no || '').trim();
        if (!lotNo) return;
        lotSeen[lotNo] = (lotSeen[lotNo] || 0) + 1;
    });
    const dupLots = Object.keys(lotSeen).filter(k => lotSeen[k] > 1);
    let dupWarning = '';
    if (dupLots.length){
        dupWarning = '⚠️ 엑셀 파일 안에 중복된 LOT이 있습니다: ' + dupLots.map(l => `${l} (${lotSeen[l]}회)`).join(', ') + ' — 마지막 행 값으로 저장됩니다.';
    }

    const badQtyLots = [], missingInfoLots = [], badFormatLots = [];
    const lotFormatRe = /^\d{10}-\d{3}$/;

    rows.forEach(r => {
        const lotNo = (r.lot_no || '').trim();
        if (!lotNo) return;
        const qtyRaw = (r.qty === null || r.qty === undefined) ? '' : r.qty.toString().trim();
        if (qtyRaw === '' || isNaN(qtyRaw) || Number(qtyRaw) < 0) badQtyLots.push(lotNo);
        if (!r.item_no || !r.item_name) missingInfoLots.push(lotNo);
        if (!lotFormatRe.test(lotNo)) badFormatLots.push(lotNo);
    });

    const validationWarnings = [];
    if (badQtyLots.length) validationWarnings.push(`⚠️ 수량 이상 LOT (${badQtyLots.length}건): ` + badQtyLots.slice(0,15).join(', '));
    if (missingInfoLots.length) validationWarnings.push(`⚠️ 품번/품명 빈 LOT (${missingInfoLots.length}건): ` + missingInfoLots.slice(0,15).join(', '));
    if (badFormatLots.length) validationWarnings.push(`⚠️ LOT 형식 이상 (${badFormatLots.length}건): ` + badFormatLots.slice(0,15).join(', '));

    const { count: existingCount, error: cntErr } = await sb.from(STOCK_COL).select('id', { count:'exact', head:true }).eq('upload_date', uploadDate);
    if (cntErr) throw cntErr;
    const existingCountBefore = existingCount || 0;

    const uploadedAt = nowDateTimeStr();
    const byLot = {};   // 같은 LOT이 여러 번 있으면 마지막 행 값으로 저장
    for (const r of rows){
        const lotNo = (r.lot_no || '').trim();
        if (!lotNo) continue;
        const cls = classifyDepartment(r.ref || '', r.warehouse || '');
        byLot[lotNo] = {
            lot_no: lotNo,
            item_no: (r.item_no || '').trim(),
            item_name: (r.item_name || '').trim(),
            qty: isNaN(r.qty) ? 0 : Math.trunc(Number(r.qty)),
            unit: (r.unit || '').trim(),
            warehouse: (r.warehouse || '').trim(),
            department: cls.department,
            subcontract_type: cls.subcontractType,
            upload_date: uploadDate,
            uploaded_at: uploadedAt,
            run_at: ''
        };
    }
    const savedRows = Object.values(byLot);
    for (let i = 0; i < savedRows.length; i += 500){
        const { error: upErr } = await sb.from(STOCK_COL).upsert(savedRows.slice(i, i + 500), { onConflict: 'upload_date,lot_no,run_at' });
        if (upErr) throw upErr;
    }
    const inserted = savedRows.length;

    let message = `✅ 업로드 완료: ${inserted}건 반영됨 (실사 날짜: ${uploadDate})`;
    if (existingCountBefore > 0) message += ` — 기존 ${existingCountBefore}건을 덮어썼습니다.`;

    return { success:true, message, dup_warning: dupWarning, validation_warnings: validationWarnings, inserted, saved_rows: savedRows };
}

uploadBtn.onclick = async () => {

    msgBox.textContent = ''; dupBox.textContent = ''; validationBox.innerHTML = '';

    const file = excelFile.files[0];
    if (!file){ msgBox.textContent = '❌ 파일을 선택해주세요.'; return; }

    if (typeSelect.value === 'stock' && existingCountForDate > 0){
        const ok = confirm(`이 날짜(${dateInput.value})에 이미 ${existingCountForDate}건의 데이터가 있습니다.\n덮어쓰시겠습니까?`);
        if (!ok) return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = '업로드 중...';

    try{
        const type = typeSelect.value;
        const parsedRows = type === 'stock' ? await parseExcelFile(file) : await parseLotExcel(file, dateInput.value);
        const result = type === 'stock' ? await uploadMaster(dateInput.value, parsedRows) : await uploadLotMaster(type, parsedRows);

        if (result.success){
            msgBox.textContent = result.message;
            msgBox.style.color = '#00e676';
            if (result.dup_warning) dupBox.textContent = result.dup_warning;
            if (result.validation_warnings && result.validation_warnings.length){
                validationBox.innerHTML = result.validation_warnings.map(w => `<div>${w}</div>`).join('');
            }
            lastUploadedRows = result.saved_rows || [];
            lastUploadedDate = dateInput.value;
            lastUploadedType = type;
            downloadBtn.style.display = lastUploadedRows.length ? 'block' : 'none';
            if (type === 'stock'){ await loadSummary(); await checkDate(); }
            else { await loadLotSummary(); }
        } else {
            msgBox.textContent = result.message;
            msgBox.style.color = '#ff8a8a';
        }
    }catch(err){
        msgBox.textContent = typeof err === 'string' ? err : ('❌ 업로드 실패: ' + err.message);
        msgBox.style.color = '#ff8a8a';
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '업로드 시작';
    }
};

loadSummary();
loadLotSummary();
checkDate();

downloadBtn.onclick = () => {
    if (!lastUploadedRows.length) return;
    if (lastUploadedType !== 'stock'){
        const label = TYPE_INFO[lastUploadedType].label;
        const aoaLot = [['#','LOT NO','품번','품명','날짜','구분']];
        lastUploadedRows.forEach((r,i) => aoaLot.push([i+1, r.lot_no, r.item_no, r.item_name, r.work_date, r.source]));
        const wsLot = XLSX.utils.aoa_to_sheet(aoaLot);
        const wbLot = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wbLot, wsLot, label);
        XLSX.writeFile(wbLot, `${label}업로드_${lastUploadedDate || 'unknown'}.xlsx`);
        return;
    }
    const header = ['#','LOT NO','부서','외주구분','품번','품명','수량','단위','창고','업로드시각'];
    const aoa = [header];
    lastUploadedRows.forEach((r,i) => {
        aoa.push([i+1, r.lot_no, r.department||'', r.subcontract_type||'', r.item_no, r.item_name, r.qty, r.unit, r.warehouse||'', r.uploaded_at||'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, lastUploadedDate || 'upload');
    XLSX.writeFile(wb, `재고업로드_${lastUploadedDate || 'unknown'}.xlsx`);
};
