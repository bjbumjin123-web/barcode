<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LOT 스캐너</title>
<meta property="og:title" content="LOT 스캐너">
<script>
(function(){
    var ua = navigator.userAgent || navigator.vendor || window.opera || '';
    var knownInAppPatterns = [/KAKAOTALK/i, /FBAN|FBAV/i, /Instagram/i, /Line\//i, /NAVER\(inapp/i, /MicroMessenger/i, /; wv\)/i];
    if (knownInAppPatterns.some(function(p){ return p.test(ua); }) && /Android/i.test(ua)) {
        location.href = "intent://" + location.href.replace(/^https?:\/\//i, '') + "#Intent;scheme=https;package=com.android.chrome;end";
    }
})();
</script>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*{ box-sizing:border-box; }
html, body{ min-height:100%; overflow-x:hidden; }
body{
    font-family:-apple-system, "Malgun Gothic", Arial, sans-serif;
    background:#111; color:#eee; margin:0; padding:10px 8px 30px;
    max-width:600px; margin-left:auto; margin-right:auto;
    display:flex; flex-direction:column;
}
h2{ text-align:center; margin:0 0 6px; font-size:16px; color:#fff; flex:0 0 auto; white-space:nowrap; }

.navbar { 
    position: -webkit-sticky; position: sticky; top: 0; z-index: 1000; background: #111; 
    padding: 8px 0; margin: 0 -6px 10px -6px; flex: 0 0 auto; 
    display: flex; justify-content: center; flex-wrap: nowrap; overflow-x: auto; 
}
.navbar a{ margin:0 2px; color:#4fc3ff; font-size:12px; text-decoration:none; padding:5px 6px; border:1px solid #2a4a5c; border-radius:10px; white-space:nowrap; }

#scannerRow, #deptRow { display:flex; gap:4px; margin-bottom:6px; flex:0 0 auto; }
#scannerInput, #deptSelect {
    flex:1 1 auto; width:100%; height:32px; font-size:13px; padding:2px 8px;
    border-radius:6px; background:#1c1c1c; color:#eee;
}
#scannerInput { border:1px solid #444; }
#deptSelect { border:1px solid #ffb84d; }

#startDataBtn{
    display:block; width:100%; margin-bottom:6px; padding:12px 0; font-size:15px; font-weight:bold;
    color:#111; background:#4fc3ff; border:none; border-radius:10px; cursor:pointer; flex:0 0 auto;
}
#startDataBtn:active{ opacity:0.8; }
#startDataBtn.closeMode{ background:#ffb84d; }

/* 마감 모드 진행바 (작게) */
#closeProgress{ display:none; align-items:center; margin:-2px 0 6px; flex:0 0 auto; }
#closeProgressBar{ flex:1 1 auto; height:6px; background:#2a2a2a; border-radius:3px; overflow:hidden; }
#closeProgressFill{ height:100%; width:0%; background:#00e676; transition:width 0.3s; }
#closeProgressText{ margin-left:6px; flex:0 0 auto; font-size:11px; color:#4fc3ff; white-space:nowrap; letter-spacing:-0.3px; }
#closeProgressText b{ color:#00e676; }

/* 마감 모달 */
#closeModalOverlay{
    display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:2900;
    align-items:center; justify-content:center; padding:16px;
}
#closeModalBox{
    background:#1c1c1c; border:2px solid #ffb84d; border-radius:14px; padding:16px;
    max-width:480px; width:100%; max-height:85vh; display:flex; flex-direction:column;
    box-shadow:0 8px 30px rgba(0,0,0,0.9);
}
#closeModalBox h3{ margin:0 0 8px; color:#ffb84d; font-size:18px; text-align:center; }
#closeSummary{ font-size:13px; color:#ccc; line-height:1.6; margin-bottom:8px; text-align:center; }
#closeSummary b.ok{ color:#00e676; } #closeSummary b.ng{ color:#ff8a8a; }
#closeList{
    flex:1 1 auto; overflow-y:auto; min-height:60px; max-height:45vh;
    background:#111; border:1px solid #333; border-radius:8px; padding:4px 10px; margin-bottom:12px;
}
.close-item{ padding:7px 0; border-bottom:1px solid #2a2a2a; }
#closeStateChips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
#closeStatusChips{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
#closeStatusChips button{ padding:4px 8px; font-size:11px; color:#bbb; background:#1a1a1a; border:1px solid #444; border-radius:12px; }
#closeStatusChips button.on{ color:#111; background:#4fc3ff; border-color:#4fc3ff; }
.st-bad{ color:#ff8a8a !important; }
.st-tag{ display:inline-block; margin-left:6px; padding:1px 6px; font-size:11px; border-radius:6px; border:1px solid #666; color:#bbb; }
.st-tag.st-bad{ border-color:#ff8a8a; }
#modalStatus{ margin:0 0 6px; font-size:12px; color:#aaa; text-align:center; }
#closeStateChips button{ flex:1 1 auto; padding:7px 6px; font-size:12px; font-weight:bold; color:#bbb; background:#1a1a1a; border:1px solid #444; border-radius:8px; }
#closeStateChips button.on{ color:#111; background:#ffb84d; border-color:#ffb84d; }
.rm-remain{ color:#ffb84d !important; } .rm-full{ color:#00e676 !important; } .rm-nodata{ color:#aaa !important; } .rm-increase{ color:#6ec1ff !important; }
.rm-tag{ display:inline-block; margin-left:6px; padding:1px 6px; font-size:11px; border-radius:6px; border:1px solid currentColor; }
.close-item .sub.txt{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.close-item.open .sub.txt{ white-space:normal; }
.close-item .sub.qty{ display:flex; align-items:baseline; flex-wrap:wrap; gap:3px; margin-top:2px; color:#ddd; }
.close-item .qn{ font-size:16px; font-weight:bold; color:#fff; }
.close-item .qu{ font-size:11px; color:#999; }
.close-item .qi{ margin-left:8px; font-size:12px; }
.close-item .qi.remain{ color:#ffb84d; } .close-item .qi.increase{ color:#6ec1ff; }
#closeSearch{ width:100%; box-sizing:border-box; height:40px; margin-bottom:6px; padding:0 12px; font-size:14px; color:#fff; background:#111; border:1px solid #444; border-radius:8px; outline:none; }
#closeSearch:focus{ border-color:#ffb84d; }
#closeFilterInfo{ font-size:12px; color:#888; margin-bottom:6px; text-align:center; min-height:14px; }
.close-wh{ position:sticky; top:0; z-index:1; margin:6px -10px 2px; padding:6px 10px; background:#26220f; color:#ffb84d; font-size:13px; font-weight:bold; border-top:1px solid #3a3315; border-bottom:1px solid #3a3315; }
.close-wh small{ color:#bba46a; font-weight:normal; margin-left:6px; }
.close-item:last-child{ border-bottom:none; }
.close-item .lot{ font-weight:bold; color:#fff; font-size:14px; }
.close-item .sub{ color:#888; font-size:12px; word-break:break-all; }
#closeModalBox .modal-btn-group button{ flex:1; height:44px; font-size:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; }
#closeConfirmBtn{ background:#ffb84d; color:#111; }
#closeCancelBtn{ background:#444; color:#eee; }
#closeConfirmBtn:disabled{ background:#555; color:#999; }

/* 네트워크 상태 표시바 */
#networkStatus {
    text-align:center; font-size:12px; font-weight:bold; margin-bottom:8px;
    padding:4px 0; border-radius:6px; background:#1c1c1c; flex:0 0 auto;
}

/* 카메라 프레임 및 줌 영역 레이어 설정 */
#camWrap{
    position:relative; width:100%; flex:0 0 auto; height:30vh; min-height:220px;
    background:#000; border-radius:12px; overflow:hidden; border:1px solid #333; touch-action:none;
}
#video{ width:100%; height:100%; object-fit:cover; display:block; position:relative; z-index:1; transform-origin:center center; transition: transform 0.1s ease; }

#guideBox{
    position:absolute; left:50%; top:50%; width:280px; max-width:92%; height:78px;
    transform:translate(-50%,-50%); border:4px solid #00e676; border-radius:10px;
    box-shadow:0 0 0 9999px rgba(0,0,0,0.6); pointer-events:none; z-index:10;
}
#guideLabel{
    position:absolute; left:50%; top:calc(50% + 46px); transform:translateX(-50%);
    color:#00e676; font-weight:bold; font-size:12px; text-shadow:0 1px 4px #000;
    pointer-events:none; z-index:11; text-align:center; white-space:nowrap;
}
#camStatus{
    position:absolute; left:50%; bottom:4%; transform:translateX(-50%); color:#fff;
    font-size:12px; background:rgba(0,0,0,0.6); padding:5px 12px; border-radius:20px;
    pointer-events:none; z-index:12; text-align:center; white-space:nowrap;
}
#zoomControls{
    position:absolute; right:8px; top:8px; display:flex; align-items:center;
    background:rgba(0,0,0,0.65); padding:4px 8px; border-radius:20px; z-index:20; white-space:nowrap;
}
#zoomControls button{ width:28px; height:28px; border-radius:50%; border:none; background:#00e676; color:#111; font-weight:bold; font-size:15px; cursor:pointer; }
#zoomControls > *{ margin:0 3px; }
#zoomLabel{ color:#fff; font-size:12px; min-width:36px; text-align:center; font-weight:bold; }
#camOff{ display:none; position:absolute; left:0; top:0; right:0; bottom:0; z-index:30; background:rgba(0,0,0,0.88); color:#fff; font-size:15px; font-weight:bold; text-align:center; line-height:1.7; align-items:center; justify-content:center; flex-direction:column; cursor:pointer; }
#camOff small{ color:#aaa; font-size:12px; font-weight:normal; }
#torchBtn{
    position:absolute; left:8px; top:8px; width:36px; height:36px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.65); color:#fff; font-size:18px; z-index:20; cursor:pointer;
}
#torchBtn.on{ background:#ffb84d; color:#111; }

#captureBtn{
    display:block; width:100%; margin:8px 0; padding:12px 0; font-size:16px; font-weight:bold;
    color:#111; background:#00e676; border:none; border-radius:10px;
    cursor:pointer; flex:0 0 auto;
}
#captureBtn:disabled{ background:#555; color:#999; }
#status{ margin-top:2px; font-weight:bold; color:#4fc3ff; text-align:center; font-size:12px; min-height:16px; flex:0 0 auto; }

#resultRow{ display:flex; margin-top:6px; flex:0 0 auto; }
body.kb-open{ padding-bottom:70vh; }   /* 키보드가 올라올 때 화면을 위로 밀어올릴 여백 */
/* 3회 연속 인식 실패 → 직접 입력 모드: 카메라를 숨기고 [상태 문구 + LOT 입력칸 + 조회]만 남김 */
#backToCamBtn{ display:none; width:100%; margin-top:6px; padding:10px; border:1px solid #444; border-radius:10px; background:#222; color:#ddd; font-size:13px; font-weight:bold; }
body.manual-mode #camWrap, body.manual-mode #captureBtn{ display:none; }
body.manual-mode #backToCamBtn{ display:block; }
#result.attention{ border-color:#00e676; box-shadow:0 0 0 3px rgba(0,230,118,0.45); }
#result{
    flex:1 1 auto; width:100%; height:40px; font-size:16px; font-weight:bold;
    padding:6px 10px; border-radius:8px; border:1px solid #444; background:#1c1c1c; color:#eee;
    letter-spacing:1px;
}
#recheckBtn{ margin-left:6px; flex:0 0 auto; padding:0 14px; font-size:13px; font-weight:bold; color:#111; background:#4fc3ff; border:none; border-radius:8px; cursor:pointer; }

#lotInfo{ margin-top:8px; padding:12px; background:#1c1c1c; border:1px solid #333; border-radius:10px; display:none; flex:0 0 auto; }
#lotInfo.found{ border-color:#2a9d2a; }
#lotInfo.notfound{ border-color:#cc4444; }

.status-tag{ font-size:12px; font-weight:bold; padding:4px 8px; border-radius:6px; display:inline-block; margin-bottom:8px; }
.status-tag.yes{ background:rgba(0,230,118,0.2); color:#00e676; border:1px solid #00e676; }
.status-tag.warn{ background:rgba(255,184,77,0.2); color:#ffb84d; border:1px solid #ffb84d; }
.status-tag.no{ background:rgba(255,138,138,0.2); color:#ff8a8a; border:1px solid #ff8a8a; }

.info-grid{ display:grid; grid-template-columns:55px 1fr; row-gap:6px; column-gap:6px; align-items:center; }
.info-label{ color:#888; font-size:12px; white-space:nowrap; }
.info-value{ font-size:15px; font-weight:bold; color:#eee; word-break:break-all; }
.info-value.big{ font-size:18px; color:#00e676; }

#openQtyModalBtn{
    width:100%; margin-top:10px; padding:12px 0; font-size:15px; font-weight:bold;
    background:#00e676; color:#111; border:none; border-radius:8px; cursor:pointer;
}

/* 화면 중앙 실수량 입력 모달 팝업 */
#qtyModalOverlay{
    display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:3000;
    align-items:center; justify-content:center; padding:16px;
}
#qtyModalBox{
    background:#1c1c1c; border:2px solid #00e676; border-radius:14px; padding:18px;
    max-width:380px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,0.9); padding:16px 14px;
}
#qtyModalBox h3{ margin:0 0 10px; color:#00e676; font-size:18px; }
#qtyModalBox{ box-sizing:border-box; }
#qtyModalBox.kb{ padding:10px 12px; }
#qtyModalBox.kb h3{ margin:0 0 4px; font-size:15px; }
#qtyModalBox.kb .wh-box{ display:none !important; }
#qtyModalBox.kb .modal-info-group{ padding:6px 8px; margin-bottom:6px; font-size:12px; }
#qtyModalBox.kb #modalWarn{ padding:5px 8px; margin-bottom:6px; font-size:12px; }

/* 모달 내부 정보 표시 그룹 */
.modal-info-group {
    background:#111; border:1px solid #333; border-radius:8px; padding:8px 12px;
    margin-bottom:14px; text-align:left; font-size:13px;
}
.modal-info-item {
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:6px 0; border-bottom:1px solid #222;
}
.modal-info-item:last-child { border-bottom:none; }
.modal-info-label { margin-right:8px; color:#888; font-weight:bold; flex-shrink:0; white-space:nowrap; }
.modal-info-val { color:#fff; font-weight:bold; word-break:keep-all; overflow-wrap:anywhere; text-align:right; flex-grow:1; min-width:0; }
#modalLotNo, #modalSysQty { white-space:nowrap; overflow-wrap:normal; }
.modal-info-val.highlight { color:#00e676; font-size:15px; }

#itemModalOverlay{ display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:3500; align-items:center; justify-content:center; padding:16px; }
#itemModalBox{ background:#1c1c1c; border:2px solid #4fc3ff; border-radius:14px; padding:16px; max-width:480px; width:100%; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 8px 30px rgba(0,0,0,0.9); }
#itemModalBox h3{ margin:0 0 6px; color:#4fc3ff; font-size:18px; text-align:center; }
#itemModalHead{ font-size:13px; color:#ccc; text-align:center; margin-bottom:8px; word-break:break-all; }
#itemModalList{ flex:1 1 auto; overflow-y:auto; max-height:55vh; background:#111; border:1px solid #333; border-radius:8px; padding:6px 10px; margin-bottom:12px; }
.wh-group-head{ margin:8px 0 4px; padding:6px 8px; background:#222; border-radius:6px; font-size:13px; font-weight:bold; color:#4fc3ff; }
.wh-group-head small{ display:block; color:#aaa; font-weight:normal; margin-top:2px; }
.wh-lot{ display:flex; justify-content:space-between; gap:8px; padding:5px 2px; border-bottom:1px solid #2a2a2a; font-size:13px; }
.wh-lot.cur{ background:rgba(0,230,118,0.12); }
.wh-lot .ok{ color:#00e676; } .wh-lot .ng{ color:#ff8a8a; } .wh-lot .sub{ color:#888; font-size:12px; }
.wh-box{ display:none; margin:8px 0 4px; }
.wh-title{ font-size:12px; color:#888; margin-bottom:4px; }
.wh-row{ display:flex; justify-content:space-between; gap:8px; padding:8px 10px; margin-bottom:4px; background:#161616; border:1px solid #2a4a5c; border-radius:8px; font-size:13px; cursor:pointer; }
.wh-row.all-done{ border-color:#00e676; }
.wh-row b{ color:#00e676; }
#modalWarn{display:none;margin:0 0 8px;padding:8px;border-radius:8px;font-size:13px;font-weight:bold;line-height:1.4;}
#modalLotNo.big{font-size:clamp(15px,5.2vw,22px);color:#ff8a8a;letter-spacing:0;}
#calcOpenBtn{ width:52px; height:48px; font-size:22px; border-radius:8px; border:1px solid #4fc3ff; background:#162a35; color:#fff; cursor:pointer; flex:0 0 auto; }
.qty-row{ display:flex; gap:8px; margin-bottom:14px; }
.qty-row #modalQtyInput{ margin-bottom:0; flex:1; width:auto; min-width:0; }
#calcOverlay{ display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:4000; align-items:center; justify-content:center; padding:16px; }
#calcBox{ background:#1c1c1c; border:2px solid #4fc3ff; border-radius:14px; padding:14px; width:100%; max-width:320px; box-shadow:0 8px 30px rgba(0,0,0,0.9); }
#calcExpr{ min-height:20px; text-align:right; color:#888; font-size:14px; word-break:break-all; }
#calcResult{ text-align:right; font-size:30px; font-weight:bold; color:#00e676; margin-bottom:10px; word-break:break-all; }
#calcPad{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
#calcPad button{ height:52px; font-size:20px; font-weight:bold; border:none; border-radius:10px; background:#2a2a2a; color:#fff; cursor:pointer; }
#calcPad button.op{ background:#26455a; color:#4fc3ff; }
#calcPad button.eq{ background:#4fc3ff; color:#111; grid-row:span 2; height:auto; }
#calcPad button.zero{ grid-column:span 2; }
#calcFoot{ display:flex; gap:8px; margin-top:10px; }
#calcFoot button{ flex:1; height:46px; font-size:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; }
#modalQtyInput{
    width:100%; height:48px; font-size:22px; font-weight:bold; text-align:center;
    border-radius:8px; border:1px solid #00e676; background:#111; color:#fff; margin-bottom:14px;
}
.modal-btn-group{ display:flex; }
.modal-btn-group button + button{ margin-left:8px; }
.modal-btn-group button{ flex:1; height:44px; font-size:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; }
#modalSaveBtn{ background:#00e676; color:#111; }
#modalCloseBtn{ background:#444; color:#eee; }
</style>
</head>
<body>

<h2>📦 LOT 스캐너</h2>

<div class="navbar">
<a href="scanview.html">🕒 기록조회</a>
<a href="progress.html">📋 진행률</a>
<a href="history.html">📅 이력조회</a>
<a href="status.html">📊 갱신현황</a>
</div>

<button id="startDataBtn">🚀 시작 (최근 10일 재고 데이터 다운로드)</button>
<div id="closeProgress"><div id="closeProgressBar"><div id="closeProgressFill"></div></div><span id="closeProgressText"></span></div>
<div id="networkStatus">🟢 네트워크 확인 중...</div>

<div id="scannerRow">
<input id="scannerInput" type="text" placeholder="작성자 입력 (최초 1회 입력 시 자동 저장)">
</div>

<div id="deptRow">
<select id="deptSelect">
<option value="">실사 부서 선택</option>
<option value="주조">주조</option><option value="자재">자재</option>
<option value="1F(가공생산)">1F(가공생산)</option><option value="2F(검사/포장)">2F(검사/포장)</option>
<option value="영업">영업</option><option value="외주">외주</option>
</select>
</div>

<div id="camWrap">
<video id="video" playsinline webkit-playsinline autoplay muted></video>
<div id="guideBox"></div>
<div id="guideLabel">박스 안에 LOT 번호 맞추기</div>
<div id="camStatus">카메라 연결 중...</div>
<div id="camOff">📷 카메라가 꺼졌습니다<small>화면을 터치하면 다시 켜집니다</small></div>
<button id="torchBtn">🔦</button>
<div id="zoomControls"><button id="zoomOut">➖</button><span id="zoomLabel">1.0x</span><button id="zoomIn">➕</button></div>
</div>

<button id="captureBtn" disabled>📸 인식하기</button>
<div id="status">상단의 [시작] 버튼을 눌러 데이터를 받아주세요.</div>
<button id="backToCamBtn">📷 카메라로 돌아가기</button>

<div id="resultRow">
<input id="result" type="text" maxlength="14" inputmode="numeric" autocomplete="off" placeholder="LOT 번호 (예: 2606260022-001)">
<button id="recheckBtn">🔍 조회</button>
</div>

<div id="lotInfo"></div>

<div id="calcOverlay">
<div id="calcBox">
<div id="calcExpr"></div>
<div id="calcResult">0</div>
<div id="calcPad">
