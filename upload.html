<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOT 스캐너</title>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:-apple-system,"Malgun Gothic",Arial,sans-serif;background:#111;color:#eee;max-width:480px;margin:20px auto;padding:16px;}
h2{font-size:16px; text-align:center; margin:0 0 10px; white-space:nowrap;}
.navbar{display:flex;justify-content:center;gap:4px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;}
.navbar a{color:#4fc3ff;font-size:12px;letter-spacing:-0.3px;text-decoration:none;padding:5px 6px;border:1px solid #2a4a5c;border-radius:10px;white-space:nowrap;}
.box{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:18px;margin-top:14px;}
label{display:block;margin-top:10px;font-size:13px;color:#ccc;white-space:nowrap;}
input, select{width:100%;padding:10px;background:#222;color:#eee;border:1px solid #444;border-radius:8px;margin:6px 0 12px;font-size:14px;box-sizing:border-box;}
button{width:100%;padding:12px;font-size:14px;letter-spacing:-0.3px;font-weight:bold;background:#00e676;color:#111;border:none;border-radius:8px;cursor:pointer;}
button:disabled{background:#555;color:#999;}
.start-btn{background:#4fc3ff;color:#111;margin-bottom:10px;}
.net-status{text-align:center;font-size:13px;margin-bottom:12px;color:#ffb84d;}
.net-status.connected{color:#00e676;}
.camera-box{background:#000;border:2px solid #00e676;border-radius:10px;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;margin-top:10px;}
.guide-rect{width:220px;height:70px;border:2px solid #00e676;border-radius:6px;margin-bottom:10px;}
.msg{margin-top:12px;font-size:13px;font-weight:bold;}
</style>
</head>
<body>

<h2>📦 LOT 스캐너</h2>

<div class="navbar">
<a href="index.html">📸 스캔</a>
<a href="scanview.html">🕒 기록조회</a>
<a href="progress.html">📋 진행률</a>
<a href="history.html">📅 이력조회</a>
<a href="upload.html">📂 업로드</a>
</div>

<button class="start-btn" id="startBtn">🚀 시작 (최근 10일 재고 데이터 다운로드)</button>
<div class="net-status" id="netStatus">⏳ 네트워크 확인 중...</div>

<div class="box">
<label>작성자 입력</label>
<input type="text" id="authorInput" placeholder="작성자 이름 입력 (최초 1회 자동 저장)">

<label>실사 부서 선택</label>
<select id="deptSelect">
<option value="">부서를 선택하세요</option>
<option value="1F(가공생산)">1F(가공생산)</option>
<option value="2F(검사/포장)">2F(검사/포장)</option>
<option value="주조">주조</option>
<option value="청우">청우</option>
<option value="자재">자재</option>
<option value="영업">영업</option>
<option value="외주">외주</option>
</select>

<div class="camera-box">
<div class="guide-rect"></div>
<div style="font-size:12px; color:#00e676;">박스 안에 LOT 번호 맞추기</div>
<div style="font-size:11px; color:#999; margin-top:5px;" id="camStatus">카메라 대기 중...</div>
</div>

<button style="margin-top:14px;" id="scanBtn" disabled>📷 인식하기</button>

<label style="margin-top:16px;">LOT 번호 직접 조회</label>
<div style="display:flex; gap:6px;">
<input type="text" id="lotInput" placeholder="예: 2606260022-001" style="margin:0;">
<button id="searchBtn" style="width:100px; background:#4fc3ff;">🔍 조회</button>
</div>

<div class="msg" id="msgBox"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// 인증 세션 중복 충돌 방지 설정 적용
const sb = createClient("https://siwaynipvwtwuoobyarp.supabase.co", "sb_publishable_lEKhT8TYzo368Hxfd0E8-Q_D9JEyO9Z", {
    auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
    }
});

const netStatus = document.getElementById("netStatus");
const startBtn = document.getElementById("startBtn");
const authorInput = document.getElementById("authorInput");
const deptSelect = document.getElementById("deptSelect");
const scanBtn = document.getElementById("scanBtn");
const msgBox = document.getElementById("msgBox");

// 로컬 저장소에서 작성자 및 부서 복원
authorInput.value = localStorage.getItem("scanner_author") || "";
deptSelect.value = localStorage.getItem("scanner_dept") || "";

authorInput.addEventListener("input", () => {
    localStorage.setItem("scanner_author", authorInput.value.trim());
});

deptSelect.addEventListener("change", () => {
    localStorage.setItem("scanner_dept", deptSelect.value);
});

// 초기 네트워크 연결 확인
async function checkConnection(){
    try {
        const { data, error } = await sb.from('stock').select('id').limit(1);
        if (error) throw error;
        netStatus.textContent = "🟢 네트워크 연결됨 (준비 완료)";
        netStatus.className = "net-status connected";
        scanBtn.disabled = false;
    } catch (e) {
        netStatus.textContent = "🔴 네트워크 연결 실패 (서버 확인 필요)";
        netStatus.className = "net-status";
    }
}

startBtn.onclick = async () => {
    startBtn.disabled = true;
    startBtn.textContent = "⏳ 데이터 다운로드 중...";
    try {
        const { data, error } = await sb.from('stock').select('*').limit(100);
        if (error) throw error;
        alert(`✅ 최신 재고 데이터 동기화 완료! (${data.length}건 로드됨)`);
        netStatus.textContent = "🟢 데이터 동기화 완료";
        netStatus.className = "net-status connected";
        scanBtn.disabled = false;
    } catch (err) {
        alert("❌ 다운로드 실패: " + err.message);
    } finally {
        startBtn.disabled = false;
        startBtn.textContent = "🚀 시작 (최근 10일 재고 데이터 다운로드)";
    }
};

checkConnection();
</script>

</body>
</html>
