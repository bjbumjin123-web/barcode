<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOT 업로드</title>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:-apple-system,"Malgun Gothic",Arial,sans-serif;background:#111;color:#eee;max-width:480px;margin:20px auto;padding:16px;}
h2{font-size:16px; text-align:center; margin:0 0 10px; white-space:nowrap;}
.navbar{display:flex;justify-content:center;gap:4px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;}
.navbar a{color:#4fc3ff;font-size:12px;letter-spacing:-0.3px;text-decoration:none;padding:5px 6px;border:1px solid #2a4a5c;border-radius:10px;white-space:nowrap;}
.box{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:18px;margin-top:14px;}
label{display:block;margin-top:10px;font-size:13px;color:#ccc;white-space:nowrap;}
input[type=file], input[type=date]{width:100%;padding:10px;background:#222;color:#eee;border:1px solid #444;border-radius:8px;margin:6px 0 12px;font-size:14px;white-space:nowrap;}
button{width:100%;padding:12px;font-size:14px;letter-spacing:-0.3px;font-weight:bold;background:#00e676;color:#111;border:none;border-radius:8px;white-space:nowrap;cursor:pointer;}
button:disabled{background:#555;color:#999;}
.msg{margin-top:14px;font-weight:bold;font-size:14px;}
.dup-msg{margin-top:10px;font-weight:bold;color:#ffb84d;font-size:13px;}
.validation-msg{margin-top:8px;font-weight:bold;color:#ff8a8a;font-size:12px;line-height:1.5;}
.date-warning{margin-top:8px;font-size:12px;color:#ffb84d;display:none;white-space:nowrap;}
.info{color:#4fc3ff;font-size:13px;margin-top:8px;line-height:1.6;background:#1c1c1c;padding:12px;border-radius:10px;border:1px solid #333;}
</style>
</head>
<body>

<h2>📂 LOT 업로드</h2>

<div class="navbar">
<a href="index.html">📸 스캔</a>
<a href="scanview.html">🕒 기록조회</a>
<a href="progress.html">📋 진행률</a>
<a href="history.html">📅 이력조회</a>
</div>

<div class="info" id="summaryBox">불러오는 중...</div>

<div class="box">
<label>실사 기준 날짜</label>
<input type="date" id="uploadDateInput" required>
<div class="date-warning" id="dateWarning"></div>

<label>엑셀 파일 선택 (.xlsx)</label>
<input type="file" id="excelFile" accept=".xlsx">

<button id="uploadBtn">업로드 시작</button>

<div class="msg" id="msgBox"></div>
<div class="dup-msg" id="dupBox"></div>
<div class="validation-msg" id="validationBox"></div>
<button id="downloadBtn" style="display:none;margin-top:10px;background:#4fc3ff;">📥 업로드한 데이터 다운로드</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc,
    getDocs, query, where, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAGIPNxEoMs9yYuQV8gP2PG09bb_F23DrQ",
    authDomain: "lot-bar.firebaseapp.com",
    projectId: "lot-bar",
    storageBucket: "lot-bar.firebasestorage.app",
    messagingSenderId: "905334285763",
    appId: "1:905334285763:web:53569a62031006a611c976"
};

const app = initializeApp(firebaseConfig);
function todayKST(){
    const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit" });
    return fmt.format(new Date());
}
const db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const STOCK_COL = "lot_stock";

function nowDateTimeStr(){
    const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    });
    const map = {};
    fmt.formatToParts(new Date()).forEach(p => map[p.type] = p.value);
    return `${map.year}-${map.month}-${map.day} ${map.hour}:${map.minute}:${map.second}`;
}

function classifyDepartment(ref, warehouse){
    ref = ref || ''; warehouse = warehouse || '';
    const isCheongwoo = ref.indexOf('청우') !== -1;

    if (warehouse === '원자재창고') return { department:'자재', subcontractType:null };
    if (warehouse === '완제품창고') return { department:'영업', subcontractType:null };
    if (warehouse === '외주창고') return { department:'외주', subcontractType:null };

    if (ref.indexOf('2F') !== -1) return { department:'2F(검사/포장)', subcontractType:null };
    if (ref.indexOf('주조') !== -1 || ref.indexOf('사상') !== -1) return { department:'주조', subcontractType:null };
    if (ref.indexOf('1F') !== -1) return { department:'1F(가공생산)', subcontractType: isCheongwoo ? '청우' : '자체' };
    if (warehouse.indexOf('반제품') !== -1) return { department:'1F(가공생산)', subcontractType: isCheongwoo ? '청우' : '자체' };

    return { department:'미분류', subcontractType:null };
}

const dateInput = document.getElementById("uploadDateInput");
const dateWarning = document.getElementById("dateWarning");
const excelFile = document.getElementById("excelFile");
const uploadBtn = document.getElementById("uploadBtn");
const msgBox = document.getElementById("msgBox");
const dupBox = document.getElementById("dupBox");
const validationBox = document.getElementById("validationBox");
const summaryBox = document.getElementById("summaryBox");
const downloadBtn = document.getElementById("downloadBtn");

let lastUploadedRows = [];
let lastUploadedDate = '';

let existingCountForDate = 0;

dateInput.value = todayKST();

async function loadSummary(){
    try{
        const snap = await getDocs(collection(db, STOCK_COL));
        const dateSet = {};
        let lastAt = null;
        let total = 0;
        snap.forEach(d => {
            const r = d.data();
            total++;
            dateSet[r.upload_date] = true;
            if (!lastAt || (r.uploaded_at || '') > lastAt) lastAt = r.uploaded_at;
        });
        const maxDate = Object.keys(dateSet).sort().pop() || null;

        const deptBreakdown = {};
        if (maxDate){
            snap.forEach(d => {
                const r = d.data();
                if (r.upload_date === maxDate){
                    const dep = r.department || '미분류';
                    deptBreakdown[dep] = (deptBreakdown[dep] || 0) + 1;
                }
            });
        }

        let html = `누적 저장된 LOT 기록: <b>${total}</b>건<br>실사 날짜 종류: <b>${Object.keys(dateSet).length}</b>개<br>마지막 업로드: <b>${lastAt || '없음'}</b>`;
        if (maxDate){
            html += `<br><br>최신 실사(${maxDate}) 부서별 분포:<br>`;
            html += Object.keys(deptBreakdown).map(d => `${d}: <b>${deptBreakdown[d]}</b>건`).join('&nbsp;&nbsp;');
        }
        summaryBox.innerHTML = html;
    }catch(e){
        console.error(e);
        summaryBox.textContent = '요약 정보를 불러오지 못했습니다.';
    }
}

async function checkDate(){
    const dt = dateInput.value;
    if (!dt) return;
    try{
        const snap = await getDocs(query(collection(db, STOCK_COL), where('upload_date','==',dt)));
        existingCountForDate = snap.size;
        if (existingCountForDate > 0){
            dateWarning.textContent = `⚠ 이 날짜에 이미 ${existingCountForDate}건의 데이터가 있습니다. 업로드하면 덮어씁니다.`;
            dateWarning.style.display = "block";
        } else {
            dateWarning.style.display = "none";
        }
    }catch(e){
        console.error("날짜 확인 실패:", e);
    }
}

dateInput.addEventListener("change", checkDate);

function parseExcelFile(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            try{
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, { type: 'array' });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });

                if (rows.length < 2){ reject('❌ 엑셀에 데이터가 없습니다.'); return; }

                const header = rows[0].map(h => (h || '').toString().trim());
                const colIndex = {
                    lot_no: header.indexOf('LOT NO'),
                    item_no: header.indexOf('품번'),
                    item_name: header.indexOf('품명'),
                    qty: header.indexOf('현 재고'),
                    unit: header.indexOf('단위'),
                    warehouse: header.indexOf('창고'),
                };
                const refIdx = header.indexOf('참조');

                const missing = Object.keys(colIndex).filter(k => colIndex[k] === -1);
                if (missing.length){
                    reject('❌ 엑셀에서 다음 컬럼을 찾을 수 없습니다: ' + missing.join(', '));
                    return;
                }

                const parsed = [];
                for (let i = 1; i < rows.length; i++){
                    const row = rows[i];
                    const lotNo = (row[colIndex.lot_no] || '').toString().trim();
                    if (!lotNo || lotNo === 'LOT NO') continue;

                    parsed.push({
                        lot_no: lotNo,
                        item_no: (row[colIndex.item_no] || '').toString().trim(),
                        item_name: (row[colIndex.item_name] || '').toString().trim(),
                        qty: row[colIndex.qty],
                        unit: (row[colIndex.unit] || '').toString().trim(),
                        warehouse: (row[colIndex.warehouse] || '').toString().trim(),
                        ref: refIdx !== -1 ? (row[refIdx] || '').toString().trim() : '',
                    });
                }
                resolve(parsed);
            }catch(err){
                reject('❌ 엑셀 파일을 읽을 수 없습니다: ' + err.message);
            }
        };
        reader.onerror = () => reject('❌ 파일을 읽는 중 오류가 발생했습니다.');
        reader.readAsArrayBuffer(file);
    });
}

async function uploadMaster(uploadDate, rows){

    if (!/^\d{4}-\d{2}-\d{2}$/.test(uploadDate)){
        return { success:false, message:'❌ 실사 날짜 형식이 올바르지 않습니다.' };
    }
    if (!rows || !rows.length){
        return { success:false, message:'❌ 엑셀에 데이터가 없습니다.' };
    }

    const lotSeen = {};
    rows.forEach(r => {
        const lotNo = (r.lot_no || '').trim();
        if (!lotNo) return;
        lotSeen[lotNo] = (lotSeen[lotNo] || 0) + 1;
    });
    const dupLots = Object.keys(lotSeen).filter(k => lotSeen[k] > 1);
    let dupWarning = '';
    if (dupLots.length){
        dupWarning = '⚠️ 엑셀 파일 안에 중복된 LOT이 있습니다: ' + dupLots.map(l => `${l} (${lotSeen[l]}회)`).join(', ') + ' — 마지막 행 값으로 저장됩니다.';
    }

    const badQtyLots = [], missingInfoLots = [], badFormatLots = [];
    const lotFormatRe = /^\d{10}-\d{3}$/;

    rows.forEach(r => {
        const lotNo = (r.lot_no || '').trim();
        if (!lotNo) return;
        const qtyRaw = (r.qty === null || r.qty === undefined) ? '' : r.qty.toString().trim();
        if (qtyRaw === '' || isNaN(qtyRaw) || Number(qtyRaw) < 0) badQtyLots.push(lotNo);
        if (!r.item_no || !r.item_name) missingInfoLots.push(lotNo);
        if (!lotFormatRe.test(lotNo)) badFormatLots.push(lotNo);
    });

    const validationWarnings = [];
    if (badQtyLots.length) validationWarnings.push(`⚠️ 수량 이상 LOT (${badQtyLots.length}건): ` + badQtyLots.slice(0,15).join(', '));
    if (missingInfoLots.length) validationWarnings.push(`⚠️ 품번/품명 빈 LOT (${missingInfoLots.length}건): ` + missingInfoLots.slice(0,15).join(', '));
    if (badFormatLots.length) validationWarnings.push(`⚠️ LOT 형식 이상 (${badFormatLots.length}건): ` + badFormatLots.slice(0,15).join(', '));

    const existingSnap = await getDocs(query(collection(db, STOCK_COL), where('upload_date','==',uploadDate)));
    const existingCountBefore = existingSnap.size;
    const idByLot = {};
    existingSnap.forEach(d => { idByLot[d.data().lot_no] = d.id; });

    const uploadedAt = nowDateTimeStr();
    let inserted = 0;
    const savedRows = [];

    let batch = writeBatch(db);
    let opsInBatch = 0;

    async function flushBatch(){
        if (opsInBatch > 0){
            await batch.commit();
            batch = writeBatch(db);
            opsInBatch = 0;
        }
    }

    for (const r of rows){
        const lotNo = (r.lot_no || '').trim();
        if (!lotNo) continue;

        const cls = classifyDepartment(r.ref || '', r.warehouse || '');
        const docData = {
            lot_no: lotNo,
            item_no: (r.item_no || '').trim(),
            item_name: (r.item_name || '').trim(),
            qty: isNaN(r.qty) ? 0 : Math.trunc(Number(r.qty)),
            unit: (r.unit || '').trim(),
            warehouse: (r.warehouse || '').trim(),
            department: cls.department,
            subcontract_type: cls.subcontractType,
            upload_date: uploadDate,
            uploaded_at: uploadedAt,
        };

        if (idByLot[lotNo]){
            batch.set(doc(db, STOCK_COL, idByLot[lotNo]), docData);
        } else {
            const newRef = doc(collection(db, STOCK_COL));
            batch.set(newRef, docData);
            idByLot[lotNo] = newRef.id;
        }
        savedRows.push(docData);

        opsInBatch++;
        inserted++;

        if (opsInBatch >= 400){
            await flushBatch();
        }
    }
    await flushBatch();

    let message = `✅ 업로드 완료: ${inserted}건 반영됨 (실사 날짜: ${uploadDate})`;
    if (existingCountBefore > 0) message += ` — 기존 ${existingCountBefore}건을 덮어썼습니다.`;

    return { success:true, message, dup_warning: dupWarning, validation_warnings: validationWarnings, inserted, saved_rows: savedRows };
}

uploadBtn.onclick = async () => {

    msgBox.textContent = ''; dupBox.textContent = ''; validationBox.innerHTML = '';

    const file = excelFile.files[0];
    if (!file){ msgBox.textContent = '❌ 파일을 선택해주세요.'; return; }

    if (existingCountForDate > 0){
        const ok = confirm(`이 날짜(${dateInput.value})에 이미 ${existingCountForDate}건의 데이터가 있습니다.\n덮어쓰시겠습니까?`);
        if (!ok) return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = '업로드 중...';

    try{
        const parsedRows = await parseExcelFile(file);
        const result = await uploadMaster(dateInput.value, parsedRows);

        if (result.success){
            msgBox.textContent = result.message;
            msgBox.style.color = '#00e676';
            if (result.dup_warning) dupBox.textContent = result.dup_warning;
            if (result.validation_warnings && result.validation_warnings.length){
                validationBox.innerHTML = result.validation_warnings.map(w => `<div>${w}</div>`).join('');
            }
            lastUploadedRows = result.saved_rows || [];
            lastUploadedDate = dateInput.value;
            downloadBtn.style.display = lastUploadedRows.length ? 'block' : 'none';
            await loadSummary();
            await checkDate();
        } else {
            msgBox.textContent = result.message;
            msgBox.style.color = '#ff8a8a';
        }
    }catch(err){
        msgBox.textContent = typeof err === 'string' ? err : ('❌ 업로드 실패: ' + err.message);
        msgBox.style.color = '#ff8a8a';
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '업로드 시작';
    }
};

loadSummary();
checkDate();

downloadBtn.onclick = () => {
    if (!lastUploadedRows.length) return;
    const header = ['#','LOT NO','부서','외주구분','품번','품명','수량','단위','창고','업로드시각'];
    const aoa = [header];
    lastUploadedRows.forEach((r,i) => {
        aoa.push([i+1, r.lot_no, r.department||'', r.subcontract_type||'', r.item_no, r.item_name, r.qty, r.unit, r.warehouse||'', r.uploaded_at||'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, lastUploadedDate || 'upload');
    XLSX.writeFile(wb, `재고업로드_${lastUploadedDate || 'unknown'}.xlsx`);
};
</script>

</body>
</html>
