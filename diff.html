<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차이 조회</title>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:-apple-system,"Malgun Gothic",Arial,sans-serif;background:#111;color:#eee;margin:0;padding:16px;}
h2{font-size:16px;text-align:center;margin:0 0 12px;white-space:nowrap;}
.navbar{display:flex;justify-content:center;gap:4px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;}
.navbar a{color:#4fc3ff;font-size:12px;letter-spacing:-0.3px;text-decoration:none;padding:5px 6px;border:1px solid #2a4a5c;border-radius:10px;white-space:nowrap;}
.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
input[type=date], input[type=text], select{padding:6px;background:#1c1c1c;color:#eee;border:1px solid #444;border-radius:6px;font-size:12px;letter-spacing:-0.3px;white-space:nowrap;flex:0 0 auto;}
button{padding:6px 10px;font-size:12px;letter-spacing:-0.3px;font-weight:bold;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;flex:0 0 auto;}
.btn-export{background:#4fc3ff;color:#111;}
.sum-box{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.8;}
.sum-box b{font-size:15px;}
.c-short{color:#ff8a8a;} .c-over{color:#ffb84d;} .c-partial{color:#c792ea;} .c-none{color:#4fc3ff;} .c-match{color:#00e676;}
table{width:100%;border-collapse:collapse;font-size:13px;background:#1c1c1c;border-radius:8px;overflow:hidden;}
th, td{padding:8px 10px;border-bottom:1px solid #2a2a2a;text-align:left;white-space:nowrap;}
th{background:#222;color:#aaa;font-size:12px;}
.empty{padding:30px;text-align:center;color:#888;white-space:nowrap;}
.scroll-wrap{overflow-x:auto;}
.master-note{font-size:12px;color:#888;margin-top:8px;}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;}
.tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:bold;color:#aaa;background:#1c1c1c;border:1px solid #333;cursor:pointer;white-space:nowrap;flex:0 0 auto;}
.tab.active{color:#111;background:#4fc3ff;border-color:#4fc3ff;}
.d-short{color:#ff8a8a;font-weight:bold;} .d-over{color:#ffb84d;font-weight:bold;} .d-partial{color:#c792ea;font-weight:bold;}
.dim{color:#888;font-size:11px;}
</style>
</head>
<body>

<h2>⚖️ 차이 조회</h2>

<div class="navbar"></div>

<div class="toolbar">
<input type="date" id="dateInput">
<select id="deptSelect"><option value="">전체 부서</option></select>
<input type="text" id="qInput" placeholder="LOT/품번/품명" style="width:110px;">
<button class="btn-export" id="refreshBtn">🔄 새로고침</button>
<button class="btn-export" id="exportBtn">📥 다운로드</button>
</div>

<div id="summary" class="sum-box">불러오는 중...</div>
<div id="content"><div class="empty">불러오는 중...</div></div>

<script type="module">
import { sb, wrap, fetchAll, renderNavbar } from "./common.js?v=3";
renderNavbar("diff");

// 하루(1회) 기준: 한국시간 07:00 ~ 다음날 06:59 를 한 회로 봄 -> 07:00 이전이면 전날 날짜를 '회차 날짜'로 사용
const ROUND_START_HOUR = 7;
function roundDateKST(){
    const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit" });
    return fmt.format(new Date(Date.now() - ROUND_START_HOUR * 3600 * 1000));
}

const STOCK_COL = "stock";
const LOG_COL = "scan_log";
const DEPARTMENTS = ["1F(가공생산)", "2F(검사/포장)", "미분류", "영업", "외주", "자재", "주조", "청우"];
// 한 LOT 을 여러 작업자가 나눠 작업하는 부서: 누적 수량이 전산수량에 못 미치면 '분할 진행'(아직 확정 전)으로 분류 (스캔 화면/진행률과 같은 기준)
const SPLIT_DEPTS = ["1F(가공생산)", "청우"];

const dateInput = document.getElementById("dateInput");
const deptSelect = document.getElementById("deptSelect");
const qInput = document.getElementById("qInput");
const summary = document.getElementById("summary");
const content = document.getElementById("content");

let currentView = "short";
let masterRows = [];       // 최신 재고(최근 실행분)
let dateLogs = [];         // 선택한 회차 날짜의 수량 입력 기록
let fallbackByLot = {};    // 최신 재고에 없는 LOT 의 품번/품명 보충용(최근 10일 재고)

dateInput.value = roundDateKST();
DEPARTMENTS.forEach(d => { const o = document.createElement("option"); o.value = d; o.textContent = d; deptSelect.appendChild(o); });

function esc(s){
    if (s === null || s === undefined) return "";
    return s.toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
const fmt = v => (v === null || v === undefined || !isFinite(Number(v))) ? "-" : (Math.round(Number(v) * 1000) / 1000).toLocaleString("ko-KR");
const signed = d => d === null ? "-" : (d > 0 ? "+" : d < 0 ? "−" : "") + fmt(Math.abs(d));

function friendlyErrorMessage(e){
    const msg = ((e && e.code) || (e && e.message) || "").toString().toLowerCase();
    if (msg.includes("resource-exhausted") || msg.includes("quota") || msg.includes("429")) return "❗ 오늘 조회 한도 초과 - 잠시 후(리셋 후) 다시 시도해주세요.";
    return "❌ 불러오기 실패 (콘솔 확인 필요)";
}

async function loadData(){
    content.innerHTML = '<div class="empty">불러오는 중...</div>';
    summary.textContent = "불러오는 중...";
    try {
        const { data: top, error: topErr } = await sb.from(STOCK_COL).select("upload_date").order("upload_date", { ascending:false }).limit(1);
        if (topErr) throw topErr;
        const masterDate = top && top.length ? top[0].upload_date : null;
        masterRows = [];
        if (masterDate){
            const stockSnap = await fetchAll(() => sb.from(STOCK_COL).select("*").eq("upload_date", masterDate));
            const latestByLot = {};
            stockSnap.forEach(d => {
                const r = d.data(), runAt = r.run_at || r.uploaded_at || "", ex = latestByLot[r.lot_no];
                if (!ex || runAt > (ex.run_at || ex.uploaded_at || "")) latestByLot[r.lot_no] = r;
            });
            masterRows = Object.values(latestByLot);
            let maxRun = "";
            masterRows.forEach(r => { const k = r.run_at || r.uploaded_at || ""; if (k > maxRun) maxRun = k; });
            if (maxRun) masterRows = masterRows.filter(r => (r.run_at || r.uploaded_at || "") === maxRun);
            masterRows = masterRows.filter(r => r.chk_type !== "실사불가 상태");
        }

        const logSnap = await fetchAll(() => sb.from(LOG_COL).select("*").eq("scan_date", dateInput.value));
        dateLogs = [];
        logSnap.forEach(d => { const r = d.data(); if (r.actual_qty !== null && r.actual_qty !== undefined) dateLogs.push(r); });   // 수량 입력까지 끝낸 스캔만

        await loadFallback();
        render();
    } catch(e){
        console.error(e);
        summary.textContent = "";
        content.innerHTML = `<div class="empty">${friendlyErrorMessage(e)}</div>`;
    }
}

// 최신 재고에 없는 LOT 은 최근 10일 재고(stock_latest)에서 품번/품명을 찾아 채움 (못 찾으면 비워 둠)
async function loadFallback(){
    fallbackByLot = {};
    const inMaster = new Set(masterRows.map(r => r.lot_no));
    const need = Array.from(new Set(dateLogs.map(r => r.lot_no))).filter(l => l && !inMaster.has(l));
    for (let i = 0; i < need.length; i += 100){
        try {
            const { data, error } = await sb.from("stock_latest").select("*").in("lot_no", need.slice(i, i + 100));
            if (error) throw error;
            (data || []).forEach(r => { if (!fallbackByLot[r.lot_no]) fallbackByLot[r.lot_no] = r; });
        } catch(e){ console.error("재고 보충 조회 실패(무시하고 계속)", e); break; }
    }
}

function noteOf(L, inMaster){
    const k = L.stock_kind;
    if (k === "recent_past") return "10일 내 과거자료 (수량 0 처리)";
    if (k === "old_past") return "장기 과거자료 (수량 0 처리)";
    if ((k === "none" || k === "lot_ref") && inMaster) return "재고 늦게 반영";
    if (k === "lot_ref") return "MES 실적 참조";
    if (k === "none") return "재고 없음";
    return "";
}

// LOT 별로 오늘 입력한 수량을 합산하고 전산수량과 비교해서 부족/초과/분할 진행/전산수량 없음/일치 로 분류
function computeEntries(){
    const masterByLot = {};
    masterRows.forEach(r => { masterByLot[r.lot_no] = r; });
    const agg = {};
    dateLogs.forEach(r => {
        const a = agg[r.lot_no] || (agg[r.lot_no] = { sum: 0, n: 0, latest: null });
        a.sum += Number(r.actual_qty); a.n++;
        if (!a.latest || r.scanned_at > a.latest.scanned_at) a.latest = r;
    });
    const out = [];
    Object.keys(agg).forEach(lot => {
        const a = agg[lot], L = a.latest, m = masterByLot[lot], fb = fallbackByLot[lot];
        const stored = (L.diff === null || L.diff === undefined) ? null : Number(L.diff);
        const base = m || fb || {};
        const e = {
            lot_no: lot, department: base.department || L.stock_dept || "", item_no: base.item_no || L.stock_item_no || "",
            item_name: base.item_name || L.stock_item_name || "", unit: base.unit || L.stock_unit || "", warehouse: base.warehouse || L.stock_wh || "",
            cum: a.sum, n: a.n, by: L.scanned_by || "", at: L.scanned_at || "", note: noteOf(L, !!m), qty: null, diff: null, cat: ""
        };
        if (m){
            const q = Number(m.qty);
            e.qty = isFinite(q) ? q : null;
            if (e.qty !== null && e.qty > 0 && SPLIT_DEPTS.indexOf(m.department) >= 0 && a.sum < e.qty){
                e.cat = "partial"; e.diff = a.sum - e.qty;
            } else {
                // 한 번만 입력하고 저장된 차이가 있으면 그 값, 여러 번 입력했거나 저장된 차이가 없으면 누적 합계 - 현재 전산수량
                e.diff = (e.qty !== null && (a.n > 1 || stored === null)) ? a.sum - e.qty : stored;
            }
        } else if (stored !== null){
            e.qty = a.sum - stored;      // 최신 재고에서 빠진 LOT: 저장돼 있던 차이로 스캔 당시 전산수량을 역산
            e.diff = stored;
        }
        if (!e.cat){
            if (e.diff === null) e.cat = "none";
            else e.cat = e.diff < 0 ? "short" : (e.diff > 0 ? "over" : "match");
        }
        out.push(e);
    });
    return out;
}

function filtered(){
    const dept = deptSelect.value, q = qInput.value.trim().toLowerCase();
    return computeEntries().filter(e => {
        if (dept && e.department !== dept) return false;
        if (q && (e.lot_no + " " + e.item_no + " " + e.item_name).toLowerCase().indexOf(q) === -1) return false;
        return true;
    });
}

const CATS = [
    { key: "short",   label: "부족",         cls: "c-short",   sort: (a, b) => a.diff - b.diff },
    { key: "over",    label: "초과",         cls: "c-over",    sort: (a, b) => b.diff - a.diff },
    { key: "partial", label: "분할 진행",    cls: "c-partial", sort: (a, b) => a.diff - b.diff },
    { key: "none",    label: "전산수량 없음", cls: "c-none",    sort: (a, b) => (a.at < b.at ? 1 : -1) }
];

function render(){
    const all = filtered();
    const by = {}; CATS.forEach(c => { by[c.key] = all.filter(e => e.cat === c.key).sort(c.sort); });
    const match = all.filter(e => e.cat === "match").length;

    summary.innerHTML = `${esc(dateInput.value)} 회차 · 수량 입력된 LOT <b>${all.length}</b>건<br>` +
        `<span class="c-match">일치 <b>${match}</b></span> · ` + CATS.map(c => `<span class="${c.cls}">${c.label} <b>${by[c.key].length}</b></span>`).join(" · ");

    const tabs = '<div class="tabs">' + CATS.map(c => `<div class="tab ${currentView === c.key ? "active" : ""}" data-view="${c.key}">${c.label} ${by[c.key].length}</div>`).join("") + "</div>";
    const rows = by[currentView] || [];
    let html = tabs;
    if (!rows.length){
        html += `<div class="empty">${currentView === "partial" ? "분할 진행 중인 LOT이 없습니다." : "해당하는 LOT이 없습니다."}</div>`;
    } else {
        html += '<div class="scroll-wrap"><table><thead><tr><th>#</th><th>LOT NO</th><th>부서</th><th>품번</th><th>품명</th><th>창고</th><th>시스템수량</th><th>실제수량</th><th>차이</th><th>입력횟수</th><th>마지막 확인자</th><th>확인시각</th><th>비고</th></tr></thead><tbody>';
        rows.forEach((e, i) => {
            const dcls = e.cat === "short" ? "d-short" : e.cat === "over" ? "d-over" : e.cat === "partial" ? "d-partial" : "";
            html += `<tr><td>${i + 1}</td><td>${esc(e.lot_no)}</td><td>${esc(e.department || "-")}</td><td>${esc(e.item_no || "-")}</td><td>${esc(e.item_name || "-")}</td><td>${esc(e.warehouse || "-")}</td>` +
                `<td>${e.qty === null ? "-" : fmt(e.qty) + " " + esc(e.unit)}</td><td>${fmt(e.cum)}${e.n > 1 ? ' <span class="dim">(합계)</span>' : ""}</td>` +
                `<td class="${dcls}">${signed(e.diff)}</td><td>${e.n}회</td><td>${esc(e.by || "-")}</td><td>${esc((e.at || "").slice(5, 16))}</td><td>${esc(e.note)}</td></tr>`;
        });
        html += "</tbody></table></div>";
        if (currentView === "partial") html += '<div class="master-note">1F·청우의 나눠 작업하는 LOT 중 누적 수량이 아직 전산수량에 못 미친 건입니다. 차이는 지금까지 부족한 수량입니다.</div>';
        if (currentView === "none") html += '<div class="master-note">재고에도 없고 스캔 당시 전산수량 기록도 없는 LOT입니다. LOT 번호 오인식이나 재고 미반영을 확인하세요.</div>';
    }
    content.innerHTML = html;
    document.querySelectorAll(".tab").forEach(t => { t.onclick = () => { currentView = t.dataset.view; render(); }; });
}

document.getElementById("exportBtn").onclick = () => {
    const all = filtered();
    const header = ["#", "부서", "LOT NO", "품번", "품명", "창고", "시스템수량", "단위", "실제수량", "차이", "입력횟수", "마지막 확인자", "확인시각", "비고"];
    const wb = XLSX.utils.book_new();
    let any = false;
    CATS.forEach(c => {
        const rows = all.filter(e => e.cat === c.key).sort(c.sort);
        if (!rows.length) return;
        any = true;
        const aoa = [header].concat(rows.map((e, i) => [i + 1, e.department, e.lot_no, e.item_no, e.item_name, e.warehouse, e.qty === null ? "" : e.qty, e.unit, e.cum, e.diff === null ? "" : e.diff, e.n, e.by, e.at, e.note]));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), c.label);
    });
    if (!any){ alert("내보낼 차이 LOT이 없습니다."); return; }
    XLSX.writeFile(wb, `차이조회_${dateInput.value}.xlsx`);
};

document.getElementById("refreshBtn").onclick = loadData;
dateInput.addEventListener("change", loadData);
deptSelect.addEventListener("change", render);
qInput.addEventListener("input", render);

// 화면을 켜둔 채 방치해도 계속 조회가 나가지 않도록 유휴 5분이면 스캔 화면으로 이동
let idleTimer = null;
function resetIdleTimer(){
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { location.href = "index.html"; }, 5 * 60 * 1000);
}
["click", "touchstart", "keydown"].forEach(evt => document.addEventListener(evt, resetIdleTimer));
resetIdleTimer();

loadData();
</script>

</body>
</html>
